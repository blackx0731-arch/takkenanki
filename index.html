<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宅建 暗記目次</title>
<style>
:root{
  --paper:#EEF1F0; --sheet:#FFFFFF; --ink:#1C2A3A; --sub:#5B6875; --line:#D5DBDD; --shu:#C8372D; --ok:#2E7D4F; --warn:#B07612;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;
  --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --g:#1C2A3A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--paper:#141A20; --sheet:#1D252D; --ink:#E6EAEE; --sub:#98A4AF; --line:#2E3943; --shu:#E0564B; --ok:#4CAF7D; --warn:#E0A542;}
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.7; -webkit-text-size-adjust:100%}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--g); outline-offset:2px}
#app{max-width:640px; margin:0 auto; padding:20px 16px 48px}

/* 見出し */
.title{font-family:var(--serif); font-size:28px; font-weight:700; letter-spacing:.04em; margin:12px 0 2px}
.lead{color:var(--sub); font-size:14px; margin:0 0 24px}
.back{display:inline-block; text-decoration:none; color:var(--sub); font-size:14px; padding:6px 0}
.h2{font-family:var(--serif); font-size:24px; font-weight:700; margin:4px 0 8px; line-height:1.4}
.h2 small{display:block; font-family:var(--sans); font-size:13px; font-weight:400; color:var(--g)}

/* ジャンル（インデックスシール） */
.genres{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.genre{width:100%; text-align:left; display:flex; align-items:stretch; background:var(--sheet); text-decoration:none; border-radius:4px; overflow:hidden; border:1px solid var(--line)}
.genre .tab{width:52px; flex:none; background:var(--gc); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:22px; font-weight:700}
.genre .body{padding:14px 16px; flex:1; min-width:0}
.genre .name{font-weight:700; font-size:18px}
.meta{font-size:13px; color:var(--sub)}

/* 進捗 */
.prog{display:flex; gap:12px; font-size:13px; color:var(--sub); flex-wrap:wrap}
.prog b{font-family:var(--serif); font-weight:700; margin-right:2px}
.prog .po b{color:var(--ok)}
.prog .ps b{color:var(--warn)}
.prog .px b{color:var(--shu)}
.bar{height:4px; background:var(--line); border-radius:2px; overflow:hidden; margin-top:8px}
.bar i{display:block; height:100%; background:var(--gc,var(--g))}

/* テーマ */
.themes{list-style:none; margin:16px 0 0; padding:0; border-top:1px solid var(--line)}
.theme button{display:block; width:100%; text-align:left; padding:14px 4px; border-bottom:1px solid var(--line); text-decoration:none}
.theme .tt{font-weight:700}

/* 絞り込み */
.seg{display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; margin:16px 0 4px; background:var(--sheet)}
.seg button{flex:1; padding:8px 4px; font-size:14px; color:var(--sub)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--g); color:#fff; font-weight:700}

/* 目次 */
.items{list-style:none; margin:12px 0 0; padding:0}
.item{background:var(--sheet); border:1px solid var(--line); border-radius:4px; margin-bottom:8px}
.item.open{border-color:var(--g)}
.q{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:14px 14px 14px 12px}
.qt{flex:1; font-weight:700; line-height:1.55}
.chev{width:8px; height:8px; border-right:2px solid var(--sub); border-bottom:2px solid var(--sub); transform:rotate(45deg); flex:none; margin-top:-4px; transition:transform .15s}
.item.open .chev{transform:rotate(-135deg); margin-top:4px}

/* 判子 */
.stamp{width:30px; height:30px; flex:none; border-radius:50%; border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-weight:700; font-size:17px; color:var(--sub)}
.stamp.on{border-style:solid; border-width:2px}
.stamp.on.m-o{border-color:var(--ok); color:var(--ok); background:color-mix(in srgb, var(--ok) 18%, transparent)}
.stamp.on.m-s{border-color:var(--warn); color:var(--warn); background:color-mix(in srgb, var(--warn) 18%, transparent)}
.stamp.on.m-x{border-color:var(--shu); color:var(--shu); background:color-mix(in srgb, var(--shu) 18%, transparent)}
.stamp.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(1.6); opacity:0} 100%{transform:scale(1); opacity:1}}

/* 詳細 */
.detail{padding:0 16px 16px; border-top:1px dashed var(--line)}
.a{padding-top:14px; line-height:1.85}
.tbl{width:100%; border-collapse:collapse; margin:10px 0; font-size:14px}
.tbl th,.tbl td{border:1px solid var(--line); padding:6px 8px; text-align:left}
.tbl th{background:color-mix(in srgb, var(--g) 10%, transparent); font-weight:700}
.a strong{background:linear-gradient(transparent 60%, color-mix(in srgb, var(--g) 22%, transparent) 60%); font-weight:700}
.trap{margin-top:12px; padding:8px 12px; border-left:3px solid var(--shu); font-size:15px; background:color-mix(in srgb, var(--shu) 7%, transparent)}
.trap b{display:block; color:var(--shu); font-size:13px}
.rate{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px}
.rate button{border:1px solid var(--line); border-radius:6px; padding:8px 4px; font-size:13px; color:var(--sub); display:flex; flex-direction:column; align-items:center; line-height:1.3}
.rate button span{font-family:var(--serif); font-size:24px; font-weight:700}
.rate button.m-o span{color:var(--ok)}
.rate button.m-s span{color:var(--warn)}
.rate button.m-x span{color:var(--shu)}
.rate button.m-o.sel{border-color:var(--ok); color:var(--ok); background:color-mix(in srgb, var(--ok) 14%, transparent); font-weight:700}
.rate button.m-s.sel{border-color:var(--warn); color:var(--warn); background:color-mix(in srgb, var(--warn) 14%, transparent); font-weight:700}
.rate button.m-x.sel{border-color:var(--shu); color:var(--shu); background:color-mix(in srgb, var(--shu) 14%, transparent); font-weight:700}

/* ランダム */
.shuf{margin-top:28px; padding-top:20px; border-top:1px solid var(--line)}
.shuf h3{font-family:var(--serif); font-size:18px; margin:0 0 4px}
.btns{display:flex; gap:8px; margin-top:12px}
.btn{flex:1; text-align:center; text-decoration:none; padding:12px 8px; border-radius:6px; font-weight:700; background:var(--ink); color:var(--paper)}
.btn.ghost{background:none; color:var(--ink); border:1px solid var(--ink)}
.card{background:var(--sheet); border:1px solid var(--line); border-top:4px solid var(--g); border-radius:4px; padding:18px 16px; margin-top:12px}
.card .where{font-size:13px; color:var(--g)}
.card .bigq{font-size:20px; font-weight:700; line-height:1.55; margin:6px 0 18px}
.card .detail{padding:0; border:0}
.count{font-size:14px; color:var(--sub)}

.empty{color:var(--sub); font-size:15px; padding:24px 4px}
.foot{margin-top:40px; text-align:center}
.foot button{font-size:13px; color:var(--sub); text-decoration:underline}

@media (prefers-reduced-motion:reduce){ .stamp.pop{animation:none} .chev{transition:none} }
</style>
</head>
<body>
<main id="app"></main>

<script>

const DATA = [

      { id:"g02-08", q:"６ 廃業等の届け",

      { id:"g03-03", q:"2 宅建士の登録基準（⑦〜⑪）",
        a:"⑦ ⑤⑥の法人で、聴聞の公示日前**60日**以内に役員であった者（取消日または届出日から5年間は不可）\n⑧ 営業に関し成年者と同一の行為能力を有しない未成年\n⑨ 一定の事由により登録の消除処分を受け、処分の日から**5年**を経過していない者\n⑩ ⑨により、登録の消除処分の聴聞の期日および場所が公示された後、相当の理由なく自ら登録の消除を申請した者で、消除された日から5年を経過してない者\n⑪ 事務の禁止処分を受け、その禁止期間中に本人からの申請により登録が消除され、事務の禁止期間がまだ満了していない",
        trap:"⑨の一定の事由：不正の手段により登録を受けた／不正の手段により宅建士証の交付を受けた／事務禁止処分事由に該当し情状が特に重い／事務禁止処分に違反\n⑪ 事務禁止処分を受けているものは他県で宅建士試験に合格しても登録欠格者。" },
      { id:"g03-04", q:"3 宅建士資格登録簿の記載事項",
        a:"① 氏名\n② 住所\n③ 本籍\n④ 性別\n⑤ 従事している宅建業者の名称または商号、免許証番号\nその他：生年月日、試験合格年月日、合格証書番号、登録番号、登録年月日",
        trap:"①〜⑤の変更は、宅建士は遅滞なく変更の登録を申請しなければならない。" },
      { id:"g03-05", q:"4 死亡等の届出義務",
        a:"① 死亡：相続人／**30日以内（知った日から）**\n② 心身の故障：本人・法定代理人・同居の親族／30日以内（その日から）\n③ 免許を取り消しされた：同上\n④ 一定の罪により罰金または拘禁以上に処せられた：同上\n⑤ 破産者：本人／30日以内（その日から）\n⑥ 成年者と同一の行為能力を有しない未成年：同上\n⑦ 暴力団員等：同上",
        trap:"②心身の故障がある一定の者になった場合とは、精神の機能の障害により、宅建士の事務を適正に行うに当たって必要な認知、判断及び意思疎通を適切に行うことができない場合をいう。" },
      { id:"g03-06", q:"5 登録の移転",
        a:"移転事由：登録先の知事管轄の都道府県以外の事務所で業務に従事しようとする場合（任意であることに注意）\n手続：現在登録している知事を経由して申請\n・講習は不要\n・古い宅建士証と引換えに新宅建士証を交付\n・有効期間は旧宅建士証の残存期間",
        trap:"単なる引越しなど、住居の移転の場合は不可。\n事務禁止期間中は不可。" },
      { id:"g03-07", q:"6 宅建士証",
        a:"宅建士証の有効期間：**5年**\n交付申請先：登録をしている都道府県知事\n法定講習：登録をしている知事が指定する講習で、交付申請前**6ヶ月以内**に行われるものを受講しなければならない",
        trap:"試験合格の日から1年以内に交付を受けようとする者、登録移転の場合は受講する必要はない。\n宅建士の氏名について、旧姓使用を希望する者は、宅建士証に旧姓を併記できる（併記後であれば業務で旧姓を使用できる）。\n住所欄にシールを貼った上で提示することができる。" },
      { id:"g03-08", q:"7 宅建士証に伴う義務",
        a:"|義務|事由|罰則\n|提示|① 重要事項の説明の際|10万円以下の過料\n|提示|② 取引の関係者から請求があったとき|罰則なし\n|提出・返納|事務禁止処分を受けたとき|10万円以下の過料\n|提出・返納|① 登録を削除されたとき ② 宅建士証が効力を失ったとき|10万円以下の過料\n|書換え交付|氏名又は住所に変更があった場合|罰則なし",
        trap:"お客から提示を求められたら提示しなければならない。\n重要事項説明のときは請求がなくても提示が必要。\n提出、返納ともに、宅建士証の交付を受けた知事に対してする。" }
    ]},
    { id:"ch04", title:"第4章 事務所の設置", items:[
      { id:"g04-01", q:"事務所とは？",
        a:"① 本店\n② 宅建業を営む支店\n③ 継続的に業務を行うことができる施設を有する場所で、宅建業に係る契約を締結する権限を有する使用人を置くところ",
        trap:"本店は、支店で宅建業を営み、本店で宅建業を営まない場合でも事務所にあたる。\n商業登記簿に登載されているかは関係ない。" },
      { id:"g04-02", q:"1 事務所に必要なもの（5点セット）",
        a:"※ ②は後述の「3 案内所等①〜④」、③は「3 案内所等①〜⑤」を指す\n\n|区分|専任の宅建士の設置義務|報酬額の掲示|従業員名簿|帳簿|標識\n|① 事務所|◯ 5人に1人以上|◯|◯|◯|◯\n|② 案内所等（契約あり）|◯ 1人以上|×|×|×|◯（届出義務あり）\n|③ 案内所等（契約なし）|×|×|×|×|◯" },
      { id:"g04-03", q:"⑴ 宅建士の設置義務",
        a:"事務所ごとに業務に従事する者**5人に1人以上**の割合で成年者である専任の宅建士を置かねばならない（リモートワークでも常駐義務を満たし得る）。\n不足した場合は**2週間以内**に補充。\n宅建業者（法人である場合は役員）が宅建士である場合、その者が主として業務に従事する事務所等については、成年者である専任の宅建士とみなす。",
        trap:"業務に従事する者→代表者、役員、受付、秘書、運転手等も含む。\n専任→非常勤、アルバイト、パートはダメ。" },
      { id:"g04-04", q:"⑵ 報酬額の掲示",
        a:"宅建業者は受け取る報酬を予め掲示する。" },
      { id:"g04-05", q:"⑶ 従業者名簿",
        a:"事務所ごとに設置。①氏名（住所・性別・生年月日は不要）②入社日③退社日④宅建士であるか否かの区別などを記録（パソコンでも可）。\n取引の関係者から請求されたら閲覧させる必要あり。\n**最終の記載から10年間**保存。" },
      { id:"g04-06", q:"⑷ 帳簿（取引台帳）",
        a:"取引のつど、取引日、宅地建物の所在・面積、取引態様、相手方の氏名・住所・取引金額、報酬額などを台帳に記録（パソコンでも可）。\nお客に閲覧させる必要なし。\n各年度末に閉鎖し、閉鎖から**5年間**（自ら売主となる新築は**10年**）の保存義務。" },
      { id:"g04-07", q:"⑸ 標識の掲示義務",
        a:"事務所ごとに、公衆の見やすい場所に標識を掲示する。" },
      { id:"g04-08", q:"2 従業者証明書制度",
        a:"宅建業者は、従業員に証明書を常に携帯をさせなければならない。\n取引先から提示を求められたら従業員証明書を提示する（× 従業者名簿、宅建士証）。",
        trap:"代表者や非常勤、アルバイトを含む全ての従業員が携帯の対象。" },
      { id:"g04-09", q:"3 案内所等の規制／案内所等とは？",
        a:"① 継続的に業務を行うことができる施設を有する場所で事務所以外のもの（例：特定のプロジェクトを行う現地出張所）\n② 一団（10以上）の宅地建物の分譲を行う場合の案内所（例：駅前案内所、現地案内所）\n③ 他の宅建業者が行う一団の宅地建物の分譲の代理・媒介をする案内所（例：他社物件の代理・媒介を行う場合の駅前案内所、現地案内所）\n④ 業務に関する展示会その他の催しを実施する場所（例：不動産フェア、住み替え相談会）\n⑤ 分譲をする際の当該宅地建物（例：マンション等の所在する場所）" },
      { id:"g04-10", q:"⑴ 標識の掲示義務（案内所等）",
        a:"①〜⑤ごとに、公衆の見やすい場所に標識を掲げなければならない。" },
      { id:"g04-11", q:"⑵ 宅建士の設置義務（案内所等）",
        a:"①〜④で、かつ契約締結や申込みを行う施設には少なくとも1名以上の成年者である専任の宅建士を設置しなければならない。",
        trap:"同一の物件について、複数の宅建業者が同一の場所において業務を行う場合には、いずれかの業者が1名以上置けば足りる。\n不動産フェア等、複数の宅建業者が異なる物件を取り扱う場合は、各業者ごとに1名以上を置く必要がある。" },
      { id:"g04-12", q:"⑶ 案内所等の届出",
        a:"①〜④で、かつ契約締結や申込みを行う施設には、案内所等の一定事項を届出る必要がある。\n\n|項目|内容\n|届出先|① 免許権者 ② 所在地を管轄する知事（両方）\n|時期|業務開始の10日前まで\n|届出事項|ア 所在地 イ 業務内容 ウ 業務期間 エ 専任の宅建士の氏名" }
    ]},
    { id:"ch05", title:"第5章 営業保証金", items:[
      { id:"g05-01", q:"供託　金額・何で",
        a:"|区分|金額\n|主たる事務所|1,000万円\n|従たる事務所（1つにつき）|500万円\n\n|有価証券の種類|評価額\n|国債|100%\n|地方債・政府保証債|90%\n|その他の債券|80%",
        trap:"金銭と有価証券は併用してもよい。" },
      { id:"g05-02", q:"供託　いつまで・どこへ",
        a:"いつまで：事業を開始するまでに\nどこへ：主たる事務所の最寄りの供託所",
        trap:"供託した旨を免許権者に届出なければ事業を開始できない。\n免許取得後3ヶ月経っても届出がなければ催告され、到達後1ヶ月経っても供託した旨の届出がなければ、免許取消しできる。" },
      { id:"g05-03", q:"事務所増設・主たる事務所の移転",
        a:"|ケース|対応\n|事務所増設|増設分を供託し、届出をしないと営業開始できない\n|主たる事務所の移転（金銭のみ）|従来の供託所に保管替え請求\n|主たる事務所の移転（有価証券を含む）|新供託所に供託し、旧供託所から取戻し" },
      { id:"g05-04", q:"還付",
        a:"誰が：宅建業に関する取引から生じた債権を有するもの（**宅建業者を除く**）\n金額：供託している営業保証金の範囲内（全店の総額）",
        trap:"代理店の報酬、従業員の給料は還付の対象外。" },
      { id:"g05-05", q:"還付後の流れ",
        a:"通知書の送付を受けた日から**2週間以内**に不足額を供託。\nその後**2週間以内**に免許権者に届出。" },
      { id:"g05-06", q:"取戻し",
        a:"|取戻し事由|公告\n|① 免許期間の満了|必要（6ヶ月以上の期間を定めて公告）\n|② 免許の取消し|必要（6ヶ月以上の期間を定めて公告）\n|③ 事務所の一部廃止（一部のみ取戻し）|必要（6ヶ月以上の期間を定めて公告）\n|④ 主たる事務所の移転（金銭のみで新たに供託＝保管替え）|不要\n|⑤ 保証協会に加入|不要",
        trap:"①〜③も取戻し事由発生から**10年経過**した場合は公告不要。" }
    ]},
    { id:"ch06", title:"第6章 保証協会", items:[
      { id:"g06-01", q:"弁済業務保証金制度　⑴ 保証協会の業務",
        a:"|区分|内容\n|必要的業務|① 苦情の解決 ② 宅建業に関する研修 ③ 弁済業務\n|任意的業務（国土交通大臣の承認が必要）|① 一般保証業務 ② 手付金等保管事業 ③ 研修費用の助成 ④ 宅建業の健全な発達を図る",
        trap:"①において宅建業者は、保証協会から説明や資料の提出を求められたら正当な理由がない限り拒んではならない。" },
      { id:"g06-02", q:"⑵ 加入手続き",
        a:"宅建業者が新たに保証協会に加入したときは、保証協会は、ただちに、その旨を免許権者に報告しなければならない。\n保証協会は、社員が社員となる前に取引をした者が有する債権に関する弁済によって、自己の弁済業務の円滑な運営に支障を生ずるおそれがあると認めるときは、その社員に対し、担保の提供を求めることができる。",
        trap:"保証協会が名称や住所・事務所の所在地を変更しようとするときは、あらかじめ、国土交通大臣に届けなければならない。\n重ねて2つの保証協会に入ることはできない。" },
      { id:"g06-03", q:"納付・供託",
        a:"|項目|納付（宅建業者→保証協会）|供託（保証協会→供託所）\n|誰が|宅建業者|保証協会\n|どこに|保証協会|法務大臣及び国交大臣の定める供託所\n|いつまで|保証協会に加入しようとする日まで|納付を受けた日から**1週間以内**に供託し、免許権者に届出\n|いくら|主たる事務所**60万**・従たる事務所**30万**|同額\n|何で|金銭のみ|金銭・有価証券\n\n増設の場合：増設後**2週間以内**に分担金を納付。怠ると社員たる地位を失う。" },
      { id:"g06-04", q:"還付・還付後の流れ",
        a:"|項目|内容\n|誰が|宅建業に関する取引から生じた債権を有するもの（宅建業者を除く）\n|いくら|営業保証金なら供託しているはずの金額の範囲内（保証協会による認証が必要、社員となる前の取引も含む）\n\n|還付後の流れ|期限\n|不足額の供託|国交大臣から通知を受けた日から**2週間以内**\n|還付充当金の納付|保証協会から通知を受けた日から**2週間以内**（納付しないと社員の地位を失う）" },
      { id:"g06-05", q:"取戻し",
        a:"|取戻し事由|公告\n|① 社員の地位の喪失（全部取戻し）|必要（**6ヶ月以上**の期間を定めて公告）\n|② 事務所の一部廃止（一部のみ取戻し）|不要" }
    ]},
    { id:"ch07", title:"第7章 広告や契約の注意事項", items:[
      { id:"g07-01", q:"1 取引態様の明示",
        a:"宅建業者は、①広告をするとき（**その都度**）②注文を受けたとき（**遅滞なく**）、取引態様を明示しなければならない。",
        trap:"口頭でOK。\n自ら貸借は含まれない。\n広告時に明示してあっても、注文時に再度必要。" },
      { id:"g07-02", q:"2 誇大広告の禁止",
        a:"何について：①所在②規模③形質　現在または将来の④利用制限⑤環境⑥交通等⑦代金の対価の額や支払方法⑧金銭貸借のあっせん\nどの程度：①著しく事実に相違する表示　または②実際より著しく優良、有利と人を誤認させるような表示\nその他：①被害がなくても宅建業法違反　②おとり広告も禁止",
        trap:"新聞、雑誌、インターネット問わずすべての広告が対象。\n事実をあえて表示しないで誤認させるのも含む。" },
      { id:"g07-03", q:"3 広告開始・契約締結時期の制限（未完成物件のみ）",
        a:"売買・交換：広告開始の時期＝許可・確認の後／契約締結の時期＝許可・確認の後\n貸借：広告開始の時期＝許可・確認の後／契約締結の時期＝**いつでもOK**",
        trap:"自ら貸借は「取引」でないので無関係。\n×予告広告　×見込み広告　×申請中という広告。\n建築確認を受けた後、変更確認の申請を提出している期間においては、変更の確認を受ける予定である旨を表示し、かつ、当初の確認内容をあわせて表示すれば、変更確認の内容を広告することができる。" }
    ]},
    { id:"ch08", title:"第8章 業務を行うときの諸規定", items:[
      { id:"g08-01", q:"1 供託所に関する説明（35条の2）",
        a:"何を：①保証協会の社員の場合は、協会の名前や住所、供託所とその所在地など　②営業保証金を供託している場合は、供託所と所在地など\nいつまで：契約が成立するまでに\n誰に：取引の相手方（相手方が宅建業者のときは不要）\n説明方法：口頭でも可",
        trap:"保証金の金額は不要。\n重要事項説明ではないので宅建士が説明する必要はない。" },
      { id:"g08-02", q:"3 不当な履行遅延の禁止",
        a:"登記、物件の引渡し、対価の支払いを不当に遅延してはならない。" },
      { id:"g08-03", q:"4 守秘義務",
        a:"正当な理由なく、業務上知り得た秘密を他に漏らしてはならない（廃業、退職後も）。",
        trap:"裁判所で証言する場合は正当な理由が認められる。\n依頼者から承諾を得て業務上知り得た秘密を伝えるのは問題ない。" },
      { id:"g08-04", q:"5 重要な事実の告知義務",
        a:"勧誘、申込みの撤回等の際に、次のことについて故意に事実を告げなかったり、不実のことを告げてはならない。\n①重要事項の説明事項　②供託所に関する説明事項　③契約書面の記載事項　④その他、相手の判断に重要な影響を及ぼすこととなるもの" },
      { id:"g08-05", q:"6 手付貸与による勧誘禁止",
        a:"手付を貸付け、分割払い、支払猶予などで契約の誘引をしてはならない。",
        trap:"代金の引下げや、手付の減額、手付金の借入のあっせん、売買代金の貸借のあっせん、媒介報酬の分割受領は可。\n実際に契約したかどうかは関係ない。" },
      { id:"g08-06", q:"7 その他の禁止事項",
        a:"・利益や将来環境について断定的判断は禁止\n・お客が申込みの撤回する際に、預り金を返還することを拒んではならない\n・お客が手付解除する場合に、正当な理由なく拒んではいけない\n・勧誘に先立ち、商号や氏名、勧誘目的であることを告げずに勧誘すること\n・お客が拒否の意思を表示しているのに、勧誘を継続すること\n・迷惑を覚えさせるような時間に電話や訪問をすること、深夜の勧誘で困惑させること\n・正当な理由なく、契約を締結するかどうかを判断するために必要な時間を与えることを拒むこと",
        trap:"断定的判断の提供は、過失でも×、契約に至らなくても×。" },
      { id:"g08-07", q:"8 宅建業の業務に関する行為の取消しの制限",
        a:"成年被後見人や被保佐人であっても、個人の宅建業者が宅建業の業務に関して行った行為は、行為能力の制限によっては取り消すことができない（未成年取り消しは可）。" }
    ]},
    { id:"ch09", title:"第9章 媒介・代理契約の規制（34条の2）", items:[
      { id:"g09-01", q:"一般媒介・専任媒介・専属専任媒介とは",
        a:"一般媒介…他の宅建業者に重ねて依頼できる\n専任媒介…他の宅建業者に重ねて依頼することができない\n専属専任媒介…自己発見取引が禁止される専任媒介契約" },
      { id:"g09-02", q:"媒介契約の規制（一般・専任）",
        a:"① 有効期間：期間は**3ヶ月以内**（超える場合は3ヶ月）\n② 更新：依頼者からの申出がある場合に限る（自動更新は無効）\n③ 報告義務：一般＝規制なし／専任＝**2週間に1回以上**の報告（口頭でも可）\n④ レインズへの登録義務：一般＝義務なし／専任＝契約日から**7日以内**に登録（初日と業者の休業日は除く）／専属専任＝契約日から**5日以内**に登録（初日と業者の休業日は除く）\n⑤ 申込みの報告：売買または交換の申込みがあったときは、遅滞なく依頼者に報告",
        trap:"レインズへの登録事項は、物件の所在・規模・形質、売買すべき価格や評価額、主要な法令上の制限、専属専任媒介契約であればその旨、物件の取引の申込みの受付に関する状況。所有者の氏名や登記の種類は不要。\nレインズからもらった登録済証を遅滞なく依頼者に引渡す（承諾あれば電磁的方法可）。\n契約成立の場合は、遅滞なくレインズへ通知（登録番号、取引価格、契約成立年月日）。" },
      { id:"g09-03", q:"媒介契約書面（34条の2書面）",
        a:"売買・交換に関する媒介・代理契約を結んだときは、遅滞なく書面を交付（承諾あれば電磁的方法でも可）。\n宅建業者が記名押印する。",
        trap:"宅建業者が価格について意見するときは依頼者の請求がなくとも根拠を示す必要がある（口頭でOK、不動産鑑定士への依頼は不要）。\n建物状況調査も限界があるので、瑕疵がないことを証明するものではない。" }
    ]},
    { id:"ch10", title:"第10章 重要事項説明（35条）", items:[
      { id:"g10-01", q:"1 概要",
        a:"誰が：義務付けられているのは宅建業者\n誰に：買主、借主（交換の場合は両当事者）\nいつまで：契約が成立するまで\nどこで：どこでも良い\n\n・宅建士が説明（専任でも一般でもよい）\n・信託を除き、取得者が宅建業者のときは説明不要（書面交付のみ）\n・請求がなくても宅建士証を提示（取得者が宅建業者であるときは、請求がない限り提示も不要）\n・書面（承諾あれば電磁的方法でも可）には宅建士が記名する",
        trap:"1つの取引に複数の業者が関与するときは、全ての業者に説明義務がある（説明は誰が行なってもよい）。\nIT重説：宅地建物の売買等の全ての取引の説明はテレビ会議等が可（宅建士証の提示は必要）。映像を視認でき、双方が音声を聞き取れ双方向でやりとりできる環境が必要。重要事項説明書等をあらかじめ送付（承諾を得た上で電磁的方法可）し、開始前に宅建士が手元の状況や映像等を確認する。" },
      { id:"g10-02", q:"2 重要事項説明書の記載事項（物件に関する事項）",
        a:"① 登記された権利\n② 法令に基づく制限\n③ 私道に関する負担\n④ 飲料水・電気・ガス等の整備状況\n⑤ 国土交通省令・内閣府令で定める事項\n⑥ （未完成物件の場合）工事完了時の形状・構造／（既存の建物の場合）建物状況調査",
        trap:"①登記：説明する時点で登記されている権利について必要（抹消予定含む）。\n②法令：都市計画法・建築基準法等における造成や建築等の制限、農地法の権利移動・転用等の制限、国土利用計画法の届出など。\n③私道：ないなら「無」と記載。\n④インフラ：未整備であれば見通し、負担金も。\n⑤省令：土砂災害警戒区域・造成宅地防災区域・津波災害警戒区域（貸借も必要）、水害ハザードマップに表示されているときは所在地、住宅性能評価を受けた新築住宅の場合はその旨（貸借は不要）、石綿使用の有無の調査結果、昭和56年6月1日より前に着工した建物の耐震診断の内容（貸借も必要）。\n⑥未完成物件：内装および外装も含む。" },
      { id:"g10-03", q:"2 重要事項説明書の記載事項（取引条件に関する事項）",
        a:"⑧ 代金・交換差金以外に授受される金額の額および目的\n⑨ 損害賠償額の予定または違約金\n⑩ 契約の解除\n⑪ 支払金・預り金を受領する場合の保全措置の有無・概要\n⑫ 契約不適合責任の保証保険契約等の措置の有無・概要\n⑬ （割賦の場合）現金価格・割賦価格・頭金の額・支払時期等\n⑭ 手付金等の保全措置\n⑮ ローンのあっせんの内容およびローン不成立の場合の措置",
        trap:"⑦建物状況調査：1年以内の調査の有無と結果（鉄筋コンクリート造りまたは鉄骨鉄筋コンクリート造りの共同住宅については2年以内）、建築や維持保全の書類の保存状況。\n⑪保全措置：受領が50万円未満の場合、登記以後に受領するものは記載・説明不要。" },
      { id:"g10-04", q:"区分所有建物・貸借の追加記載事項",
        a:"区分所有建物の追加記載事項（規約がある場合、案の段階含む）：①管理委託先の氏名・住所　②専有部分の利用制限　③共有部分に関する規約　④専用使用権　⑤修繕費や管理費を特定の者のみ減免する内容　⑥計画修繕積立金の内容、すでに積み立てられている額　⑦敷地に関する権利の種類および内容　⑧通常の管理費の額　⑨（一棟の）修繕の実施状況\n\n貸借の場合は①登記された権利と②法令に基づく制限だけで足りる。",
        trap:"④専用使用者の氏名・住所は不要。\n⑥修繕積立金の滞納額を含む。\nこの項目はPDFの表が崩れていたため、宅地・建物ごとの◯×一覧（石綿調査結果・耐震診断など）は原本で必ず確認してください。" }
    ]},
    { id:"ch11", title:"第11章 37条書面", items:[
      { id:"g11-01", q:"1 37条書面の作成・交付",
        a:"誰が：義務付けられているのは宅建業者\n誰に対して：契約の両当事者（業者間でも交付が必要）\nいつまで：契約成立後遅滞なく\n方法：書面には宅建士が記名する（業者間でも必要）",
        trap:"宅建士は専任でも一般でもよい。\n重要事項を説明した宅建士でなくてもよい。\n宅建士に説明、交付までさせる必要はない。\n承諾があれば書面の代わりに電磁的方法でも可。\n1つの取引に複数の業者が関与する場合、全ての宅建業者が宅建士に記名させる義務を負う。" },
      { id:"g11-02", q:"2 37条書面の記載事項",
        a:"売買・貸借とも必要：①当事者の氏名・住所　②物件を特定する事項　③代金・交換差金・借賃の額・支払時期・支払方法　④引渡し時期　⑤危険負担（天災その他不可抗力による損害の負担）　⑥代金等以外の金銭の額・授受の時期・目的　⑦契約解除　⑧損害賠償額の予定または違約金\n\n売買のみ必要：移転登記申請の時期／（既存の建物）構造耐力上主要な部分等の当事者双方の確認／あっせんが不成立のときの措置／租税／契約不適合責任、または保証保険契約の内容",
        trap:"①〜⑥（移転登記申請の時期まで）は必要的記載事項。\n②物件特定：建物であれば所在・種類・構造など／未完成建物は設計図。\n③代金等：消費税額も明記。" }
    ]},
    { id:"ch12", title:"第12章 自ら売主制限（8種の規制）", items:[
      { id:"g12-00", q:"8種の規制の適用範囲",
        a:"8種の規制は、業者が自ら売主となる場合に適用（**業者間の取引には適用されない**）。" },
      { id:"g12-01", q:"1 クーリングオフ制度",
        a:"宅建業者が自ら売主となる宅地建物の売買契約において、事務所等以外の場所で、買受けの申込み又は売買契約を締結した者は、申込みの撤回又は契約の解除を行うことができる。\n\nクーリングオフできる場合：書面で可（発信主義）※電磁的方法は不可。損害賠償・違約金請求はダメ。手付金等は速やかに返還。申込者に不利な特約は無効。",
        trap:"書面を発した時に効力が生じる（＝発信主義）。" },
      { id:"g12-02", q:"クーリングオフできない場合",
        a:"⑴ 冷静な判断が可能な場所で契約\n　① 事務所\n　②（土地に定着し、専任の宅建士の設置義務がある）案内所、展示会場、継続的に業務できる場所\n　③ 買主申出の場合の買主の自宅・勤務場所での契約\n⑵ 履行の終了（引渡しを受け、かつ、代金全額を支払った場合）\n⑶ 8日間の経過（書面で告げられてから8日が経過）",
        trap:"申込みと契約締結の場所が異なるときは申込場所が基準。\n代理、媒介業者の①②の場所も含む。" },
      { id:"g12-03", q:"告知書面の記載事項",
        a:"①買受けの申込みをした者又は買主の氏名（法人にあっては商号又は名称）及び住所\n②売主である宅建業者の商号又は名称及び住所並びに免許証番号\n③8日を経過する日までの間は、引渡しを受け、かつ、代金の全部を支払った場合を除き、書面により撤回・解除できること\n④撤回・解除があったときは、宅建業者は損害賠償又は違約金の支払を請求することができないこと\n⑤撤回・解除は、その旨を記載した書面を発した時に効力を生ずること\n⑥撤回・解除があった場合、支払われている手付金等は宅建業者が遅滞なく全額返還すること" },
      { id:"g12-04", q:"2 手付金の性質と額の制限",
        a:"相手方が履行に着手するまでは、買主は手付金を放棄して、売主は手付金の倍額を現実に提供して解除できる。",
        trap:"手付金は代金額の**2/10**が上限。\n買主に不利な特約は無効。\n手付は解約手付とみなす（×推定）。" },
      { id:"g12-05", q:"3 手付金等の保全措置",
        a:"宅建業者は手付金等の全額について保全措置を講じた後でなければ、手付金等を受領してはならない。\n手付金等とは：契約締結の日から物件の引渡し前までに支払われる金銭で代金に充当されるもの。\n\n保全措置が不要な場合：①所有権登記をしたとき\n②受領額が少ないとき（ア 未完成物件：代金の**5%以下**かつ**1,000万円以下**／イ 完成物件：代金の**10%以下**かつ**1,000万円以下**）\n\n保全措置の方法：⑴未完成物件→①銀行等による保証　②保険事業者による保証保険\n⑵完成物件→①、②、③指定保管機関による保管",
        trap:"保証は書面が原則だが、買主の承諾があれば電磁的方法でも可。\n保証保険契約を締結し保険証券等を買主に交付する。保険期間は宅地建物の引渡しまでの期間でなければならない。" },
      { id:"g12-06", q:"4 損害賠償額の予定の制限",
        a:"原則：違約金と合わせて代金額の**2/10**が上限（2/10を超える部分は無効）。" },
      { id:"g12-07", q:"5 自己の所有に属しない物件の売買契約の制限",
        a:"原則：他人物売買、未完成建物の売買は禁止。\n例外：①他人物売買＝現在の所有者と売買契約又は売買の予約がされているとき　②未完成建物＝手付金等の保全措置を講じているとき",
        trap:"①は停止条件付ではダメ（例：農地法5条の許可）。" },
      { id:"g12-08", q:"6 契約不適合責任の特約の制限",
        a:"（民法）契約不適合がある場合は追完請求等ができる。買主は不適合を知った時から**1年以内**に売主に通知する必要がある。\n原則：契約不適合責任について民法より買主に不利な特約は無効。\n例外：責任追及期間を引渡した日から**2年以上**とする定めはOK。" },
      { id:"g12-09", q:"7 割賦販売契約の解除の制限",
        a:"原則：解除するには**30日以上**の期間を定めて書面で催告、残代金の一括請求も不可（この定めに反する特約は無効）。" },
      { id:"g12-10", q:"8 割賦販売等における所有権留保等の禁止",
        a:"原則：割賦販売、提携ローン付き売買の場合、所有権留保と譲渡担保は禁止。\n例外：①受領額が**3/10以下**　②担保（抵当権等）の設定がなく見込みもない",
        trap:"譲渡担保は例外①のみ。" }
    ]},
    { id:"ch13", title:"第13章 報酬額の制限", items:[
      { id:"g13-01", q:"報酬の範囲",
        a:"宅建業者は大臣が定める額を超えて報酬を受け取ることはできない。\n原則：成約に至らなかった場合は報酬のみならず、必要経費も請求できない。\n\n例外：①依頼者からの依頼によって行う広告料金　②依頼者からの特別の依頼により支出する特別費用で、事前に依頼者の承諾があるもの\n③低廉な空き家等の売買・交換に関する特例：代金額が**800万円**（税抜き）以下の空家等で、通常より現地調査等の費用を要するものは、費用相当額を合算した金額の範囲内で報酬を受領できる（上限**30万円＋税**／売主・買主の双方から受領可、合計最大66万円）\n④長期の空家等の貸借に関する特例",
        trap:"通常の計算方法の額を超えて受領するには、あらかじめ依頼者に説明をし、合意する必要がある。" },
      { id:"g13-02", q:"長期の空家等の貸借に関する特例",
        a:"＜媒介＞双方から受ける報酬額の合計額は賃料の1ヶ月分の**2.2倍**以内。ただし借主から受ける報酬額は賃料の1ヶ月分の**1.1倍**（居住用の場合は、借主の承諾を得ている場合を除き**0.55倍**）以内。\n＜代理＞貸主から受けることができる報酬額は、賃料の1ヶ月分の**2.2倍**以内。相手方からも報酬を受ける場合には、合計額は賃料の1ヶ月分の2.2倍以内（借主からは1.1倍以内）。",
        trap:"長期の空家とは、現に長期間（1年を超える期間）にわたって居住用・事業用などに使用されていない、あるいは、相続などをしても将来にわたり使用される見込みがない宅地・建物。" },
      { id:"g13-03", q:"1 消費税",
        a:"①土地の取引、②居住用建物の賃貸は非課税。\n・課税事業者は、消費税相当額（**10%**）を含んだ額が報酬の上限額になる。\n・免税事業者は、消費税額の**40%**（つまり4%）を報酬に含ませることができる。" },
      { id:"g13-04", q:"2 報酬額の計算 ⑴ 売買交換の場合",
        a:"① 媒介の場合　一方からの限度額（取引価格×**3%＋6万円**）\n② 代理の場合　一方からの限度額（取引価格×3%＋6万円）×**2**\n③ 1社で代理＆媒介の場合は合計（取引価格×3%＋6万円）×2\n\n＜400万を超える＞取引価格×3%＋6万円\n＜200万を超えて400万まで＞取引価格×**4%＋2万円**\n＜200万以下＞取引価格×**5%**" },
      { id:"g13-05", q:"2 報酬額の計算 ⑵⑶ 貸借・複数業者",
        a:"⑵ 貸借の場合\n原則：賃料の**1ヶ月分**が上限（受け取れる合計額）。ただし、居住用建物の媒介の場合、媒介依頼時に依頼者から承諾を得てない限り依頼者の一方からは**1/2ヵ月**が限度。\n例外：権利金を取引価格とみなして⑴の方法で計算可（居住用建物以外）。\n\n⑶ 複数の業者が関わる場合\n① 各業者が受領できる限度額内　かつ　② 総額は全業者を1人とみなして受領できる限度額内" }
    ]},
    { id:"ch14", title:"第14章 監督処分と罰則", items:[
      { id:"g14-01", q:"1 監督処分 ⑴ 宅建業者・宅建士に対する監督処分",
        a:"宅建業者：指示処分→業務地を管轄する知事／業務停止処分→免許権者（地方整備局長を含む）・行為地を管轄する知事／免許取消処分→免許権者（地方整備局長を含む）\n宅建士：指示処分・事務禁止処分→登録をしている知事／登録消除処分→登録をしている知事のみ" },
      { id:"g14-02", q:"指示処分事由",
        a:"①業務に関し、取引の関係者に損害を与えたとき、または損害を与えるおそれが大であるとき\n②業務に関し、取引の公正を害する行為をしたとき、または取引の公正を害するおそれが大であるとき\n③業務に関し、他の法令（住宅瑕疵担保履行法除く）に違反し宅建業者として不適当と認められるとき\n④宅建士が監督処分を受けた場合で、宅建業者の責めに帰すべき事由があるとき\n⑤宅建業法の規定または住宅瑕疵担保履行法における保証金の供託義務に違反" },
      { id:"g14-03", q:"業務停止処分・免許取消処分",
        a:"業務停止処分：①**1年以内**の期間を定めて②業務の全部または一部の停止を③命ずることができる。\n\n免許取消処分（任意的）：ア 免許に付された条件に違反したとき　イ 宅建業者の所在や事務所が確知できず公告したとき（公告の日から**30日以内**に申出る必要）　ウ 営業保証金を供託した旨の届出がないとき" },
      { id:"g14-04", q:"免許取消処分（必要的）",
        a:"①暴力団員等に該当するとき　②暴力団員等が事業を支配　③不正の手段により免許を受けた　④業務停止処分事由に該当し情状が特に重いとき　⑤業務停止処分に違反したとき　⑥宅建業法違反等の罪により罰金刑以上に処されたとき　⑦罪名を問わず拘禁刑以上に処されたとき　⑧心身の故障がある一定の者、破産者（復権を得ない者）となったとき　⑨未成年の法定代理人・法人の役員等が欠格事由に該当するに至ったとき　⑩廃業等の届出がなく、その事実が判明したとき　⑪免許を受けてから1年以内に営業を開始しないとき、または引き続き1年以上営業を休止したとき　⑫免許換えをすべき事由に該当しながら、新たに免許を受けない" },
      { id:"g14-05", q:"⑵⑶ 宅建士への処分・監督処分の手続き",
        a:"事務禁止処分とは、**1年以内**の期間を定めて、宅建士としてすべき事務の全部または一部を禁止すること。\n\n公告：a.大臣の処分の場合は官報　b.知事の処分の場合は公報やウェブサイトなど適切な方法でできる。宅建業者に対する業務停止処分・免許取消処分→公告必要。宅建業者に対する指示処分、宅建士に対する処分→公告不要。\n通知等：業務地・行為地を管轄する知事が指示処分等をした場合のみ、その知事から免許権者等に対して行う。",
        trap:"国土交通大臣は、その免許を受けた宅建業者が消費者保護のための一定の規定に違反したことを理由に監督処分を行うときは、あらかじめ、内閣総理大臣に協議しなければならない。" },
      { id:"g14-06", q:"2 罰則",
        a:"⑴ 3年以下の拘禁刑もしくは300万円以下の罰金、または併科：不正の手段によって免許を受けた／無免許で宅建業を営んだ／名義貸しの禁止規定に違反して他人に宅建業を営ませた／業務停止処分に違反して営業\n\n⑵ 50万円以下の罰金：5点セット違反（専任の宅建士設置義務違反は**100万円以下**の罰金）等\n\n⑶ 10万円以下の過料（行政罰）：①宅建士証の返納義務に違反した宅建士　②宅建士証の提出義務に違反した宅建士　③重要事項の説明時に宅建士証を提示しなかった宅建士" }
    ]},
    { id:"ch15", title:"第15章 住宅瑕疵担保履行法", items:[
      { id:"g15-00", q:"制度の目的",
        a:"新築住宅の売主たる宅建業者が倒産して、品確法の瑕疵担保責任を果たせなくなったときに備えて、宅建業者に供託又は保険への加入を義務付けている。",
        trap:"買主が宅建業者である場合は資力確保義務は生じない。\n供託と保険加入の併用OK。" },
      { id:"g15-01", q:"品確法の売主の瑕疵担保責任",
        a:"誰が：新築住宅の売主\n瑕疵の範囲：建物の超重要部分に瑕疵がある場合に限る（①構造耐力上主要な部分＝基礎・土台・床・屋根・柱・壁／②雨水の侵入を防止する部分＝屋根・外壁・雨水排水管）\n責任の内容：民法と同じ　①損害賠償②解除③瑕疵修補④代金減額\n責任期間：引渡しから**10年**",
        trap:"新築住宅とは、工事完了日から起算して**1年以内**で未入居のもの。\n瑕疵担保責任を負わない特約は無効。" },
      { id:"g15-02", q:"1 資力確保の方法 ⑴ 住宅販売瑕疵担保保証金の供託",
        a:"誰が：新築住宅の自ら売主となる宅建業者\nどこへ：主たる事務所の最寄りの供託所\nいつまでに：基準日（**3月31日**）から**3週間**を経過する日までの間に\n何で：金銭・有価証券\n供託金額：基準日から過去**10年**さかのぼって引渡した総戸数に応じて算定される額",
        trap:"信託会社や信託業務を兼営する金融機関で宅建業を営むものも宅建業者に含む。\n保険加入している分は総戸数から除かれる。\n床面積55㎡以下の新築住宅は2戸で1戸と数える。\n主たる事務所の移転：金銭のみ→保管替え請求／有価証券を含む→新たに供託。" },
      { id:"g15-03", q:"説明義務・還付後の流れ・取戻し",
        a:"説明義務：買主に対し、契約締結するまでに、供託所の所在地等について書面（買主の承諾があれば電磁的方法でもOK）を交付して説明。\n還付後の流れ：供託額が不足となった場合は、大臣から還付の通知を受けたとき又は不足を知ったときから、**2週間以内**に供託し、供託後**2週間以内**に免許権者に届出が必要。\n取戻し：宅建業者は基準日において保証金の額が法定額を超えることとなった場合、免許権者の承認を得て超過額を取り戻すことができる。" },
      { id:"g15-04", q:"⑵ 保険に加入する",
        a:"宅建業者は、新築住宅について**10年以上**の住宅販売瑕疵担保責任保険をかけ、自らその保険料を払わなければならない（国交大臣の承認を受けた場合を除き、解除できない）。\n保険証券又はこれに代わるべき書面を買主に交付しなければならない。\n瑕疵担保責任が生じたときは、宅建業者は保険法人に保険金を請求する。" },
      { id:"g15-05", q:"2〜4 届出義務・契約禁止・住宅紛争の解決",
        a:"2 届出義務：宅建業者は基準日ごとに①過去10年間に引渡した新築の戸数②供託を利用した戸数③保険を利用した戸数を基準日から**3週間以内**に免許権者に届出。\n\n3 契約禁止：資力確保措置を講じず、または届出をしないときは、基準日の翌日から起算して**50日**を経過した日から新たな新築住宅の売買契約をすることができない。\n\n4 住宅紛争の解決：指定住宅紛争処理機関は、住宅瑕疵担保責任保険付き新築住宅の売買契約等に関する紛争について、あっせん・調停・仲裁を行うことができる（裁判外）。新築住宅、リフォーム瑕疵保険付き住宅、既存住宅売買瑕疵保険付き住宅が対象。" }
    ]}
  ]},
  { id:"seigen", no:"②", name:"法令上の制限", color:"#2E8B57", themes:[
    { id:"h01", title:"都市計画法 第1章 都市計画区域の指定", items:[
      { id:"h01-01", q:"1 都市計画区域の指定権者",
        a:"原則：都道府県\n例外：国土交通大臣（2つ以上の都道府県にまたがる場合）" },
      { id:"h01-02", q:"2 都市計画区域の指定手続（参考）",
        a:"①関係市町村の意見を聞く→②都市計画審議会の意見を聞く→③国土交通大臣と協議をし、同意を得る→④公告" },
      { id:"h01-03", q:"3 都市計画区域の整備、開発および保全の方針（マスタープラン）",
        a:"都市計画区域全体の方針に関するマスタープランを定め、都市計画の内容は、これに即したものでなければならない。" },
      { id:"h01-04", q:"4 準都市計画区域",
        a:"都市計画区域外の区域のうち、積極的な整備または開発を行う必要はないものの、そのまま土地利用を整序し、または環境を保全するための措置を講ずることなく放置すれば、将来における一体の都市として総合的に整備、開発および保全に支障が生じるおそれがある区域。\n\n定めることができる地域地区：用途地域、特別用途地区、特定用途制限地域、高度地区、風致地区",
        trap:"後から都市計画区域が指定された場合、準都市計画区域は廃止とみなす。" }
    ]},
    { id:"h02", title:"都市計画法 第2章 都市計画の種類", items:[
      { id:"h02-01", q:"1 市街化区域と市街化調整区域",
        a:"都市計画区域について、必要がある時は、市街化区域と市街化調整区域を定めることができる（3大都市圏の一定区域では必ず区域区分を定める）。\n\n市街化区域：①すでに市街地②おおむね**10年以内**に優先的かつ計画的に市街化を図るべき区域\n市街化調整区域：市街化を抑制すべき区域" },
      { id:"h02-02", q:"2 地域地区　⑴ 用途地域",
        a:"市街化区域には必ず用途地域を定める。市街化調整区域には原則として定めない（任意）。非線引き区域、準都市計画区域には定めることができる。それ以外には定めることができない。\n\n住居系：①第1種低層住居専用地域（低層住宅）②第2種低層住居専用地域（主として低層住宅＋コンビニ）③田園住居地域（農業の利便の増進）④第1種中高層住居専用地域（中高層住宅）⑤第2種中高層住居専用地域（主として中高層住宅＋スーパー）⑥第1種住居地域（住居の環境を保護）⑦第2種住居地域（主として住居の環境を保護＋パチンコ）⑧準住居地域（道路の沿道）\n商業系：⑨近隣商業地域（近隣住民に日用品を供給する商業）⑩商業地域（主として商業）\n工業系：⑪準工業地域（環境悪化のおそれがない工業）⑫工業地域（主として工業）⑬工業専用地域（工業の利便を増進）",
        trap:"田園住居地域内では、農地内で土地の形質の変更、建築物の建築、土石等の堆積を行う者は、非常災害や都市計画事業の施行を除いて、市町村長の許可が必要。なお、市町村長は300㎡未満のものについては、許可をしなければならない。" },
      { id:"h02-03", q:"用途地域内のみに定められる地区①②③④⑤",
        a:"① 特別用途地区：用途地域の指定に重ねて定めることができる（補完）\n② 高度地区：目的＝市街地の環境を維持する・土地利用の増進／内容＝高さの最高限度・最低限度\n③ 高度利用地区：目的＝土地の合理的かつ健全な高度利用と都市機能の更新／内容＝容積率・建蔽率等\n④ 高層住居誘導地区：利便性の高い高層住宅を誘導するために定められる（第1種住居地域、第2種住居地域、準住居地域、近隣商業地域、準工業地域内限定）\n⑤ 居住環境向上用途誘導地区：病院・店舗など日常生活に必要な施設について用途規制や容積率制限を緩和し、日常生活に必要な施設の建築を誘導する地区（内容＝建築物の用途・容積率と建蔽率の最高限度・壁面の位置の制限・高さの最高限度）" },
      { id:"h02-04", q:"用途地域外にも定められる地区⑥⑦⑧⑨",
        a:"⑥ 特定用途制限地域：用途地域が定められていない区域で、特定の建築物等を制限するもの（非線引き区域と準都市計画区域に限る）\n⑦ 特定街区：目的＝市街地の整備改善を図るため街区の整備が行われる地区／内容＝容積率・高さの最高限度\n⑧ 防火地域・準防火地域：市街地における火災を防止（建築基準法で規制）\n⑨ 風致地区：都市における自然の風致を維持する（地方公共団体の条例で規制）" },
      { id:"h02-05", q:"3 都市施設",
        a:"⑴ 概要：道路・公園・水道・学校・図書館・病院・市場・団地、都市安全確保拠点施設等。都市計画区域外にも定めることができる。\n⑵ 義務的な都市計画：市街化区域および非線引き区域では、少なくとも道路、公園、下水道を定める。住居系の地域は、義務教育施設を必ず定めなければならない。\n⑶ 大規模な都市施設（参考）：①20ha以上の住宅施設②官公庁施設③流通業務団地" },
      { id:"h02-06", q:"4 市街地開発事業",
        a:"市街地開発事業とは積極的な街づくり事業をいい、①新住宅市街地開発事業（ニュータウンづくり）②土地区画整理事業（再開発）③市街地再開発事業（再開発）など全部で7種類。\n市街化区域内、非線引き区域内においてのみ定められる。" },
      { id:"h02-07", q:"5 市街地開発事業等予定区域",
        a:"大規模な都市施設やニュータウンづくりに関して、あらかじめ準備段階として予定区域を定めることができる。" },
      { id:"h02-08", q:"6 地区計画（小規模の街づくり）　⑴ 概要",
        a:"地区計画とは、それぞれの区域の特性にふさわしい態様を備えた良好な環境の各街区を整備・開発したり、保全したりするための計画（小規模の街づくり）。\n\n対象区域：①用途地域②用途地域が定められていない地域（一定の場合）\n都市計画に定める内容：種類、名称、位置とともに、区域や地区整備計画を定めるとともに、区域の面積、計画の目標、整備・開発・保全に関する方針を定めるよう努める。一定の場合、再開発等促進区や開発整備促進区を定めることができる。\n地区整備計画：施設の配慮・規模など地区計画を具体化するための計画（現存する農地の形質変更等の行為制限に関する事項も定めることができる）",
        trap:"準都市計画区域は不可。市街化調整区域においても定めることができるが、地区計画区域の周辺における市街化を促進しないよう定める。" },
      { id:"h02-09", q:"⑵ 届出・許可が必要な行為",
        a:"届出が必要な行為：①土地の区画形質の変更②建築物の建築・工作物の建設③農地の行為制限が定められている区域内での土石等の堆積\n届出先：市町村長　届出時期：行為に着手する日の**30日前**まで\n\n許可が必要な行為：地区計画に農地の行為制限が定められている場合、市町村は、条例で①土地の形質変更②建築物の建築・工作物の建設③土石その他の物件の堆積について市町村長の許可を義務付けることができる。",
        trap:"地区計画の内容に適合しないと認める時は、その届出をした者に対し、設計の変更などの必要な措置をとることを勧告することができる。\n届出不要の行為：通常の管理行為・軽易な行為、非常災害の応急措置、国または地方公共団体が行う行為、都市計画事業の施行として行う行為、開発許可を要する行為。\n違反すると50万円以下の罰金を科す規定を設けることもできる。" }
    ]},
    { id:"h03", title:"都市計画法 第3章 都市計画の決定", items:[
      { id:"h03-01", q:"1 都市計画の決定権者（参考）",
        a:"都道府県が決定：①都市計画区域の整備・開発・保全（マスタープラン）②市街化区域、市街化調整区域の区分③都市再開発方針等④地域地区⑤都市施設⑥市街地開発事業⑦市街地開発事業等予定区域（2つの都道府県にまたがるものは国土交通大臣）\n市町村が決定：④〜⑦（都道府県が決定しない小規模のもの）⑧地区計画" },
      { id:"h03-02", q:"2 都市計画の決定手続　⑴ 都道府県の場合",
        a:"①必要に応じて公聴会を開催、市町村とも協力\n③住民と利害関係人は意見書を提出できる\n⑤都道府県は意見書の要旨を提出する\n⑥国の利害に重大な関係のある場合（協議・同意）" },
      { id:"h03-03", q:"⑵ 市町村の場合",
        a:"市町村は、住民参加の公聴会を開催のうえ都市計画に関する基本的方針（マスタープラン）を定めなければならない。\n市町村が都市計画を決定するときは知事と協議しなければならない。",
        trap:"マスタープランに知事の同意は不要。\nマスタープランは、議会の議決を経て定めた基本構想に即して定める必要がある。" },
      { id:"h03-04", q:"⑶ その他の注意点",
        a:"＜住民参加＞土地の所有者、借地権者やまちづくりNPOは、土地所有者等の**2/3以上**の同意を得られれば、都市計画の決定や変更を提案することができる（都市計画提案制度）\n＜良好な環境＞都市緑化支援機構は、一定の区域内の土地所有者等の**2/3以上**の同意を得られれば、素案を添えて、緑地の保全・緑化の推進を図るために必要な都市計画の決定や変更を提案することができる\n＜空き地・空き家対策＞市町村長は、都市計画の決定に関する協力を適正・確実に行うことができる法人等を都市計画協力団体として指定でき、団体は市町村に対し、都市計画の決定等を提案することができる\n＜計画が競合した場合＞都道府県と市町村の都市計画が抵触する場合は、都道府県のが優先する",
        trap:"都道府県や市町村は、都市施設等の整備に係る都市計画の案を作成しようとする場合には、整備を行うと見込まれる者との間で、都市施設等整備協定を締結することができる。" }
    ]},
    { id:"h04", title:"都市計画法 第4章 都市計画制限", items:[
      { id:"h04-01", q:"都市計画制限（知事等の許可の要否）",
        a:"③予定区域内：建築物の建築・工作物の建設は許可が必要、5トン超の物の設置・堆積は不要\n①都市計画決定の告示後：許可が必要（例外＝階数が2以下、かつ、地階のない木造建築物の改築・移転は不要）\n②都市計画事業の認可の告示後：許可が必要",
        trap:"①都市計画に適合、または階数2以下で地階を有せず主要構造部が木造・鉄骨造・コンクリートブロック造などの構造で、容易に移転・除去できるものは原則として許可しなければならない。\n②建築・建設・土地の形質変更については、事業施行の障害とならない場合は許可不要。" }
    ]},
    { id:"h05", title:"都市計画法 第5章 開発許可制度", items:[
      { id:"h05-01", q:"1 開発行為とは",
        a:"開発行為には知事の許可が必要。\n① 建築物の建築または特定工作物の建設の用に供する目的で行う\n　建築物：ビル、マンション\n　特定工作物：第1種＝プラント／第2種＝ゴルフコース、**1ha以上**（野球場、庭球場、遊園地、墓園）\n② 土地の区画形質の変更" },
      { id:"h05-02", q:"許可不要な開発行為（面積要件）",
        a:"市街化区域：**1,000㎡未満**（三大都市圏の一定区域は500㎡未満）\n市街化調整区域：面積要件なし（そもそも例外に該当しない限り許可必要）\n非線引き区域：**3,000㎡未満**\n準都市計画区域：**1万㎡未満**\nその他の区域：**1万㎡未満**" },
      { id:"h05-03", q:"許可不要な開発行為（面積以外）",
        a:"②農林漁業用の一定の建築物（農産物の生産・集荷用等）、農林漁業者の居住用の建築物\n③公益上必要（鉄道施設、図書館、公民館、変電所、博物館）\n④都市計画事業の施行として行う開発行為\n⑤公有水面埋立法の埋立地で竣功認可告示前に行われる開発行為\n⑥非常災害の応急措置\n⑦通常の管理行為、軽易な行為（例：車庫）\n⑧土地区画整理事業・市街地再開発事業等の施行として行う開発行為",
        trap:"②農林漁業用でも貯蔵・加工用の建築物は許可が必要。\n③医療施設や学校は許可が必要。\n国・都道府県が行う開発行為は、知事との協議の成立で許可があったとみなされる。" },
      { id:"h05-04", q:"2 開発許可の申請手続き　⑴⑵ 同意・申請書",
        a:"⑴ 公共施設の管理者の同意等：現在、関係のある公共施設の管理者と協議・同意。将来、公共施設を管理することとなる者と協議。\n\n⑵ 申請書の記載事項：開発区域の位置・区域および規模／建設が予定されている建築物または特定工作物の用途（構造・設備等は不要）／開発行為に関する設計（**1ha以上**の場合は一定の資格を有する者による作成が必要）／工事施行者\n添付書類：公共施設の管理者の同意を得たことを証する書面や協議の経過を証する書面／土地所有者などの相当数の同意を得たことを証する書面" },
      { id:"h05-05", q:"⑶ 33条・34条の許可基準（参考）",
        a:"① 一般的基準（一例）：用途地域などの用途の制限に適合／排水施設が適切に配置／地区計画に適合／権利を有する者の相当数の同意\n\n② 市街化調整区域での開発行為の基準（一例）：①の基準に加えて34条のどれかに該当する必要がある（第2種特定工作物を除く）。周辺住民が利用する公益的施設、日用品を販売する店舗／農林漁業用建築物（許可不要以外）、市街化調整区域内で生産される農林水産物の処理、貯蔵、加工用の建築物／災害危険区域から区域外への移転を目的とする開発行為",
        trap:"デベロッパーの開発は資力や信用なども必要。" },
      { id:"h05-06", q:"⑷⑸⑹ 許可・不許可、変更、廃止",
        a:"⑷ 許可・不許可：知事は、遅滞なく許可又は不許可の処分をして文書で通知する。許可をしたら開発登録簿に一定事項を登録。用途地域が定められていない区域の場合は、知事は、建蔽率、高さ、壁面の位置そのほか建築物の構造等に関する制限を許可にあたって定めることができる。\n\n⑸ 変更の許可：原則＝申請書の記載事項を変更する場合は知事の許可が必要／例外＝軽微な変更は不要（遅滞なく届出）、許可不要な場合に変更するときも不要（届出も不要）\n\n⑹ 工事の廃止：開発をやめる場合には、遅滞なく知事に届出が必要" },
      { id:"h05-07", q:"⑺⑻⑼⑽ 地位の承継〜公共施設",
        a:"⑺ 地位の承継：一般承継人（相続）＝許可不要／特定承継人（売買）＝許可不要（あらかじめ知事の承認が必要）\n\n⑻ 工事完了後の届出：全部の工事を完了したときは知事に届出。届出を受けた知事は遅滞なく検査し検査済証を交付する。\n\n⑼ 工事完了の公告：知事は、検査済証を交付したときは遅滞なく工事完了の公告をしなければならない。\n\n⑽ 公共施設の管理・用地の帰属：公共施設は、市町村が管理する。公共施設の用地の所有権は公共施設の管理者に帰属する。" },
      { id:"h05-08", q:"3 建築行為等の制限",
        a:"工事完了公告前（開発許可ある開発区域内）：原則、予定建築物等以外は建築・建設不可\n工事完了公告後（開発許可ない市街化調整区域内）：原則、建築・建設不可\n\n例外（公告前）：①工事用仮設建築物②知事が認めたとき③同意していない土地の所有者\n例外（公告後）：①知事が許可したとき（国・都道府県が行う行為は知事との協議で許可があったものとみなされる）②用途地域等が定められている",
        trap:"市街化調整区域における開発許可が不要な場合とほぼ同じ（＋仮設建築物）。" }
    ]},
    { id:"h06", title:"建築基準法 第1章 概要", items:[
      { id:"h06-01", q:"1 定義",
        a:"建築：新築・増築・改築・移転\n建築主事：建築確認を行う公務員。必ず設置＝①都道府県②人口**25万人以上**の政令指定都市／任意設置＝③その他の市町村\n指定確認検査機関：建築主事とみなされ建築確認を行う民間機関\n特定行政庁：建築主事または建築副主事のいる市町村の長、知事" },
      { id:"h06-02", q:"2 適用除外",
        a:"① 文化財保護法によって指定された国宝・重要文化財\n② 施行の際にすでに立っている建築物（既存不適格建築物）" },
      { id:"h06-03", q:"3 建築協定",
        a:"意味：地域の所有者や借地権者が集まって、建築基準法よりも厳しい制限を課すこと\n制限の内容：敷地・位置・構造・用途・形態・意匠・建築設備\n区域：条例で定められた区域\n\n手続：成立＝**全員の合意**／変更＝**全員の合意**／廃止＝**過半数の合意**",
        trap:"合意の後に特定行政庁の認可・公告が必要。効力の発生後は、その後に所有者・借地権者になった人にも効力が及ぶ。\n一人協定：分譲業者が売り出す前に1人で建築協定を作る。認可の日から**3年以内**に、1人目に売った時点で効力発生。" }
    ]},
    { id:"h07", title:"建築基準法 第2章 建築確認", items:[
      { id:"h07-01", q:"1 建築確認の要否",
        a:"特殊建築物（床面積合計**200㎡超**）：全国で、建築・大規模修繕模様替え・用途変更のすべてに確認が必要\n大規模建築物（①2階以上（地下含む）②延べ面積200㎡超のどちらかに該当）：全国で、建築・大規模修繕模様替えに確認が必要（用途変更は不要）\n都市計画区域等の一般の建築物：建築のみ確認が必要",
        trap:"都市計画区域等＝都市計画区域、準都市計画区域、準景観地区、知事指定区域。" },
      { id:"h07-02", q:"⑴ 特殊建築物とは・⑵ 建築確認が不要な場合",
        a:"特殊建築物：不特定多数が出入りするところ（事務所はあたらない）。例：映画館、病院、ホテル、共同住宅、学校、体育館、百貨店、スーパー、コンビニ、倉庫、自動車車庫\n\n建築確認が不要な場合：①防火地域・準防火地域以外で、**10㎡以内**の増築・改築・移転　②特殊建築物を類似へ用途変更（例：旅館→ホテル）" },
      { id:"h07-03", q:"2 建築確認の手続き",
        a:"・建築基準法及び関連規定に適合するかを調査する\n・構造計算適合判定を要する場合は、適合性判定通知書の提出が必要\n・消防署長などの同意が必要（防火・準防火地域以外で行うマンションを除く住宅の建築の場合は不要）\n・大規模建築物以外の建築物に係るものに限り、建築副主事が建築確認を行える" },
      { id:"h07-04", q:"中間検査・使用開始時期",
        a:"中間検査：**3階以上**の共同住宅の床およびはりに鉄筋を配置する工事は、特定の段階が終わったらその都度、中間検査を申請しなければならない。\n\n使用開始時期：＜一般の建築物＞いつでも使用開始できる／＜大規模建築物・特殊建築物＞（原則）検査済証の交付後から使用開始",
        trap:"（例外）交付前でも使用できる：①特定行政庁が支障がないと認めたとき②建築主事が国土交通大臣の定める基準に適合していると認めたとき③完了検査の申請が受理された日から**7日**を経過したとき。" },
      { id:"h07-05", q:"3 その他　是正措置・仮設建築物の特例・不服申立て",
        a:"⑴ 是正措置：違反建築が行われた場合、特定行政庁等は、建築主・工事請負人・所有者などに、工事の施行停止や使用禁止を命じることができる。\n\n⑵ 仮設建築物の特例：特定行政庁は、仮設建築物について安全上・防火上・衛生上支障がないと認める場合は、**1年以内**の期間を定めて建築を許可することができる（建築確認は必要、他の規定の一部が適用されない）。\n\n⑶ 不服申立て：処分に不服があるものは、建築審査会に審査請求することができる。それにも不服がある場合は、国土交通大臣に対して再審査請求できる。",
        trap:"オリンピックなど特別の必要がある場合は、建築審査会の同意を得て1年を超えて使用可能。" }
    ]},
    { id:"h08", title:"建築基準法 第3章 単体規定", items:[
      { id:"h08-01", q:"構造計算・大規模建築物の主要構造部",
        a:"構造計算：①高さ**60m超**②高さ60m以下で一定の規模\n大規模建築物の主要構造部：①地階を除く階数が**4以上**②高さ**16m超**③倉庫、自動車車庫、自動車修理工場等高さ**13m超**のいずれかに該当する建築物は、特定主要構造部に関して一定の基準を満たし国土交通大臣が定めた構造方法を用いなければならない。" },
      { id:"h08-02", q:"防火・倉庫等",
        a:"防火：耐火・準耐火以外の建築物で延べ面積**1000㎡超**のものは、防火壁や防火床で各区画の床面積を1000㎡以内に区画。\n倉庫等：**3階以上**の部分の床面積が**200㎡以上**であるものは、耐火建築物としなければならない。" },
      { id:"h08-03", q:"採光・換気・アスベスト・地階・避雷設備等",
        a:"採光：採光のための居室の開口部は床面積に対して**1/7以上**（50ルクス以上の照明設備の設置等の措置があれば1/10以上）\n換気：換気のための居室の開口部は床面積に対して**1/20以上**\nアスベスト：建築材料に石綿等を添加してはならない\n地階：地階の居室、教室、病室は衛生上必要な防湿措置\n避雷設備：高さ**20m超**\n非常用エレベーター：高さ**31m超**\n階段の手すり：階段には手すりを設ける（高さ1m以下の部分には不要）",
        trap:"地方公共団体は、条例で必要な制限を附加できる。\n市町村は、国土交通大臣の承認を得れば、条例で制限を緩和できる。\n地方公共団体は、条例で災害危険区域を指定でき、住居用建築物の建築禁止等は条例で定める。" }
    ]},
    { id:"h09", title:"建築基準法 第4章 集団規定", items:[
      { id:"h09-00", q:"集団規定の適用範囲",
        a:"都市計画区域、準都市計画区域、知事指定区域に適用される。" },
      { id:"h09-01", q:"1 道路規制　⑴ 建築基準法上の道路",
        a:"4m以上：①法令による道路②すでに存在していた道③2年以内に道路をつくる事業が予定され、特定行政庁が指定したもの④私道であり特定行政庁から位置指定を受けたもの\n\n4m未満（2項道路）：すでに道と建築物が存在し、特定行政庁が指定したもの。中心線から**2m**が道路とみなされ建物を建築できない（セットバック）。" },
      { id:"h09-02", q:"⑵ 接道義務",
        a:"原則：建築物を建てる敷地は、道路に**2m以上**接しなければならない\n\n例外：①周囲に空地＋特定行政庁が建築審査会の同意を得て許可　②幅員4m以上の道（道路含まず）に2m以上接する建築物＋利用者が少数＋特定行政庁が認める",
        trap:"地方公共団体は、延べ面積が**1000㎡超**の建築物について条例で制限を付加できる。敷地が袋路状道路にのみ接する延べ面積が**150㎡**を超える長屋等も同様。" },
      { id:"h09-03", q:"⑶⑷⑸ 道路内の建築制限・私道の変更廃止・壁面線",
        a:"⑶ 道路内の建築制限：原則、道路内に建物などをつくることはできない（例外＝地下に建築するもの、公衆便所・派出所など公益上必要な建築物で特定行政庁が建築審査会の同意を得て許可したもの、公共用歩廊など特定行政庁が許可したもの）\n\n⑷ 私道の変更または廃止の制限：私道の変更や廃止によって接道義務違反となる場合には、特定行政庁はこれらを禁止または制限することができる\n\n⑸ 壁面線の指定および制限：壁面線の指定がされた場合は、建築物の壁、柱、高さ**2m**を超える門、塀は、壁面線を超えてつくってはならない（地下の部分と特定行政庁が許可した歩廊の柱は認められる）" },
      { id:"h09-04", q:"2 用途制限",
        a:"敷地が複数の地域にまたがる場合は、過半が属する敷地の規制に従わなければならない。\n特定行政庁の許可があれば、禁止されているものも建築できる。\n特別用途地区内では、地方公共団体は条例で用途制限を緩和できる（国交大臣の承認必要）。\n都市計画区域内では、ゴミ処理施設、火葬場、卸売市場等の処理施設は、都市計画において敷地の位置が決定しているものでなければ、新築・増築できない。",
        trap:"150㎡以下の店舗・飲食店は工業専業地域において例外あり。" },
      { id:"h09-05", q:"3 建蔽率　⑴ 制限の緩和等",
        a:"建蔽率は、原則として都市計画で定める（用途地域の指定のない区域は特定行政庁が都市計画審議会の議を経て定める）。商業地域は**8/10**。\n\n緩和：特定行政庁指定の角地→**10%緩和**／防火地域＋耐火建築物→**10%緩和**／準防火地域＋準耐火以上→10%緩和／建蔽率80%＋防火地域＋耐火建築物→**制限なし（100%）**／公園・広場・道路などにあり特定行政庁が許可したもの→制限なし／派出所・公衆便所・公共用歩廊→制限なし／隣地境界線から後退して壁面線の指定があるなどで特定行政庁が許可したもの→範囲内で緩和" },
      { id:"h09-06", q:"⑵ 敷地が地域の内外にわたる場合",
        a:"① 規制の異なる地域にまたがる場合：各地域の建蔽率の限度に、その敷地の当該地域にある各部分の面積の敷地全体の面積に占める割合を乗じた数値の合計以下でなければならない（別々に計算して足す）\n② 防火地域の内外にわたる場合：建築物の全部が耐火建築物であるときは、その敷地は全て防火地域とみなされる\n③ 準防火地域と防火・準防火地域以外の区域にわたる場合：建築物の全部が耐火・準耐火建築物であるときは、全て準防火地域内にあるものとみなされる" },
      { id:"h09-07", q:"4 容積率",
        a:"容積率は都市計画で定める（用途地域の指定のない区域は特定行政庁が定める）。商業地域は**130/10**。\n\n前面道路の幅員による容積率：前面道路の幅が**12m未満**の場合は、都市計画で定められた容積率と、道路幅に**6/10**（住居系は**4/10**）をかけた数字とを比較し、より厳しいものを容積率とする。\n\n⑴ 敷地が地域の内外にわたる場合：各地域の容積率の限度に、その敷地の当該地域にある各部分の面積の敷地全体の面積に占める割合を乗じた数値の合計以下でなければならない（別々に計算して足す）" },
      { id:"h09-08", q:"容積率の緩和措置",
        a:"延べ面積に算入しない：①地階で天井が地盤面からの高さ1m以下にあるものの住宅・老人ホーム・福祉ホームの用途に供する部分（上限は用途全体の1/3）②エレベーターの昇降路③共同住宅もしくは老人ホームの共用廊下、階段、エレベーターホール、エントランスホール④宅配ボックスの一定の範囲⑤住宅または老人ホーム等に設ける機械室の部分で特定行政庁が認めたもの\n\n緩和措置：敷地の周囲に広い公園・広場・道路などの空地がある場合、特定行政庁が建築審査会の同意を得て許可したものは容積率が緩和される" },
      { id:"h09-09", q:"5 敷地面積の最低限度",
        a:"全ての用途地域では、都市計画で**200㎡**を超えない範囲内で敷地面積の最低限度を定めることができる。" },
      { id:"h09-10", q:"6 低層住居専用地域等での規制",
        a:"⑴ 絶対的高さ制限：低層住居専用地域や田園住居地域内では、**10mまたは12m**のうち、都市計画で定められた高さを超えてはならない\n⑵ 外壁の後退距離：低層住居専用地域や田園住居地域内では、建築物の外壁、またはこれに代わる柱の面から敷地境界線までの距離を**1.5mまたは1m**と定めることができる" },
      { id:"h09-11", q:"7 高さの規制　⑴ 3つの斜線制限",
        a:"道路斜線：全ての用途地域で適用\n隣地斜線：低層住居専用地域・田園住居地域では適用されない\n北側斜線：低層住居専用地域・田園住居地域・中高層住居専用地域で適用される（住居系のうち住居地域以上は適用されない）",
        trap:"敷地が制限の異なる地域にわたる場合は、建築物の各部分の地域等の斜線制限による。" },
      { id:"h09-12", q:"⑵ 日影規制",
        a:"商業、工業、工業専用地域以外で条例が指定した区域に日影規制が適用される。",
        trap:"特定行政庁が建築審査会の同意を得て許可した場合には、日影規制は適用されない。\n敷地が道路、水面、線路敷などに接する場合、隣接する敷地との高低差が著しいなど特別の事情があるときには緩和措置がある。\n同一の敷地内に2以上の建築物がある場合は、これらの建築物を1つの建築物とみなして日影規制を適用。\n対象区域外にある高さ**10m超**の建築物で、冬至日に対象区域内に一定時間日影を生じさせるものは、対象区域内にあるとみなされて日影規制が適用される。" },
      { id:"h09-13", q:"⑶ その他の高さ制限",
        a:"特定用途誘導地区、居住環境向上用途誘導地区で、高さの最高限度が定められたときでも、特定行政庁がやむを得ないと認めて許可したものについては、最高限度を超えてもかまわない。" },
      { id:"h09-14", q:"8 防火地域・準防火地域　⑴ 建築物の規制",
        a:"防火地域または準防火地域にある建築物は、①外壁の開口部（窓や出入り口）で延焼の恐れのある部分に防火戸等の政令で定める防火設備を設けることが必要②建築物や防火設備を、延焼防止性能に関して国土交通大臣の定めた構造方法、または認定を受けたものとする必要がある。",
        trap:"建築物が火熱遮断壁等で区画されている場合は、本規制との関係では別の建築物とみなされる。" },
      { id:"h09-15", q:"⑵⑶ その他の規制・内外にわたる場合",
        a:"防火地域：①屋根＝一定の技術的基準に適合し、国土交通大臣の定めた構造方法または認定を受けたものでなければならない②外壁＝耐火構造の外壁は隣地境界線に接して設けることができる\n防火地域・準防火地域共通：③看板＝屋上または高さ**3m超**の看板は主要部分を不燃材料で造り、または覆わなければならない\n\n⑶ 建築物が防火地域等の内外にわたる場合：防火壁で有効に区分されているときを除いて、最も厳しい地域の規制が適用される" }
    ]},
    { id:"h10", title:"国土利用計画法", items:[
      { id:"h10-01", q:"1 事後届出制",
        a:"一定面積以上の土地について土地取引した場合、権利取得者（買主）は、契約を締結した日から**2週間以内**に、市町村長を経由して都道府県知事に届出なければならない。" },
      { id:"h10-02", q:"⑴ 届出対象面積",
        a:"① 市街化区域内：**2,000㎡以上**\n② 市街化区域以外の都市計画区域内：**5,000㎡以上**\n③ 都市計画区域外：**10,000㎡以上**",
        trap:"面積は権利取得者を基準に考える。物理的・計画的一体性がある場合は時間的にずれていても取得する土地の合計で判断。" },
      { id:"h10-03", q:"⑵ 事後届出が必要な土地取引",
        a:"届出必要：売買、売買予約、交換、賃借権（権利金あり）、譲渡担保、代物弁済\n\n届出不要：贈与、相続、時効、賃借権（権利金なし）、抵当権の設置、裁判所が関係（調停、和解、競売）、農地法3条1項の許可（5条1項は必要）、非常災害の応急措置、当事者の一方または双方が国・地方公共団体である場合" },
      { id:"h10-04", q:"⑶ 事後届出の手続",
        a:"届出事項：利用目的＋土地の対価　審査事項：利用目的のみ",
        trap:"勧告に従わない場合→勧告内容を公表することができる（罰則なし）。勧告に従った場合→土地の処分についてあっせんするよう努める（買取請求不可）。" },
      { id:"h10-05", q:"2 事前届出制（注視区域・監視区域）",
        a:"目的：適正な土地利用＋地価の抑制（事後届出制は適正な土地利用のみ）\n対象区域：注視区域、監視区域（事後届出制はその他の区域）\n誰が：両当事者（事後届出制は権利取得者）\n届出時期：契約前に届出（事後届出制は契約後2週間以内）\n審査の対象：利用目的・対価（事後届出制は利用目的のみ）\n審査期間：届出後**6週間以内**に勧告（監視区域は**3週間以内**）",
        trap:"審査期間中に契約すると契約は有効だが罰則あり。届出義務違反も契約は有効だが罰則あり。勧告に従わない場合は勧告内容を公表することができる（契約は有効、罰則なし）。" }
    ]},
    { id:"h11", title:"農地法", items:[
      { id:"h11-01", q:"1 定義",
        a:"農地：登記簿上の地目とは関係なく事実状態で判断する（休耕地、休閑地も含まれる）\n\n権利移動：①売買、贈与、競売などで所有権が移転する場合②賃借権、地上権、永小作権、使用貸借権、質権",
        trap:"抵当権はあたらない。\n土地の面積は登記簿の地積を基準とするが、著しく事実と違う場合や地積がない場合は実測に基づき農業委員会が認定したところによる。" },
      { id:"h11-02", q:"2 許可の要否（3条・4条・5条）",
        a:"3条（権利移動）：許可する者＝農業委員会／対象＝農地→農地、採草→採草\n4条（転用）：許可する者＝知事等／対象＝農地→その他（採草→その他は除く）／市街化区域の特例あり（農業委員会に届出）\n5条（権利移動＋転用）：許可する者＝知事等／対象＝農地→その他、採草→その他" },
      { id:"h11-03", q:"違反の場合",
        a:"3条・5条：罰則あり、契約は無効、原状回復等の措置（命令に従わない場合は違反情報を公表）\n4条：罰則あり、原状回復等の措置（命令に従わない場合は違反情報を公表）" },
      { id:"h11-04", q:"収用・許可不要のその他",
        a:"収用：土地収用法で収用・使用・転用する場合、国・都道府県が取得するときは許可不要\n\n協議で許可があったとみなされる場合：①国・都道府県が道路、農業用排水等にする②国・都道府県が学校、医療施設、社会福祉施設、庁舎等を造る場合は、知事等との協議が必要（許可があったとみなされる）\n\nその他許可不要：①相続、遺産分割、包括遺贈、相続人への特定遺贈、合併（農業委員会に届出が必要）②民事調停法の農事調停③農業用施設に供する目的での**2a未満**の場合",
        trap:"「農地法3条の許可があったときは所有権が移転する」という停止条件付売買契約を原因とする仮登記の申請を行う場合は農業委員会の許可（3条）は不要。" },
      { id:"h11-05", q:"3 その他",
        a:"農地の賃貸借は、登記がなくても、農地の引渡しがあれば第三者に対抗できる。\n農地の賃貸借は、存続期間の上限が**50年**。" }
    ]},
    { id:"h12", title:"土地区画整理法", items:[
      { id:"h12-01", q:"1 土地区画整理事業とは",
        a:"公的な施行者：都道府県、国土交通大臣、都市再生機構等（市街地開発事業なので市街化区域と非線引き区域でのみ可能。土地区画整理審議会を設置）\n民間の施行者：土地区画整理組合、個人施行者等（公的施行者の区域のほか市街化調整区域でも行うことができる）" },
      { id:"h12-02", q:"2 事業の流れ　⑴ 組合の成立",
        a:"① 組合を設立しようとする者は、**7人以上**で、定款および事業計画を定める\n② 事業計画等について所有者、借地権者の**2/3以上**の同意を得る\n③ 知事に対して組合設立の申請を出す\n④ 知事が組合設立の認可をすれば土地区画整理組合が成立",
        trap:"施行地区内の宅地の所有者および借地権者はすべて組合員となる（その後に地区内の宅地を取得した者も組合員となる）。\n認可を受けたものは認可の公告があった日から**1か月以内**に総会を招集（定款に特別の定めがある場合を除き組合員の半数以上が出席する必要）して、理事と監事を選任。" },
      { id:"h12-03", q:"組合成立後の行為制限",
        a:"組合成立の認可の公告以降、換地処分の公告までの間に以下の行為をしようとする者は知事等の許可が必要。\na. 事業施行の障害となるおそれのある土地の形質変更\nb. 事業施行の障害となるおそれのある建築物の建築、工作物の建設\nc. 移動の容易でない物件（**5t超**）の設置・堆積" },
      { id:"h12-04", q:"⑵ 換地計画の作成",
        a:"① 施行者は総会の議決で換地計画を作成する（換地照応の原則：前後で位置、地積、土質、水利、環境などが照応するように定めなければならない）\n② 施行者は換地計画について知事の認可を受けなければならない",
        trap:"所有者の申出または同意がある場合には換地を定めなくてよい（清算金で調整）。\n総会での投票は書面の提出に代えて、電磁的方法によってもできる場合がある。" },
      { id:"h12-05", q:"⑶ 仮換地の指定",
        a:"換地処分を行うため必要がある場合に仮換地を指定する（総会の同意が必要）。対象者に対して仮換地の位置・地積、効力発生日を通知する。",
        trap:"従前の宅地は、換地処分の公告の日まで施行者が管理し建物も除去できる。\n仮換地指定の効力発生日と仮換地を使用収益開始できる日を別に定めた場合、その間どちらの宅地も使用できないので、その代わりに損失補償を受ける。" },
      { id:"h12-06", q:"⑷ 換地処分",
        a:"施行者は工事が全部完了したら遅滞なく換地処分を行わなければならない（ただし、組合規約で例外可）。\n換地処分は関係権利者に通知され、知事によって公告が行われる。\n施行者は、換地処分の公告後、遅滞なく変動に係る登記を申請しなければならない（他の人はそれまで登記できない）。" },
      { id:"h12-07", q:"⑸ 保留地",
        a:"保留地とは、事業の費用に充てるため誰にも換地しないで施行者が取得する土地（後で売却等して換金する）。" }
    ]},
    { id:"h13", title:"盛土規制法", items:[
      { id:"h13-01", q:"1 定義",
        a:"宅地：農地、採草放牧地及び森林並びに道路、公園、河川その他政令で定める公共施設用地以外の土地\n宅地造成：宅地以外の土地を宅地にするために行う盛土その他の土地の形質の変更で政令で定めるもの\n特定盛土等：宅地又は農地等において行う盛土その他の土地の形質の変更で、宅地又は農地等に隣接し、又は近接する宅地において災害を発生させるおそれが大きいものとして政令で定めるもの\n土石の堆積：宅地又は農地等において行う土石の堆積で政令で定めるもの（一定期間の経過後に除却するものに限る）\n宅地造成等：宅地造成、特定盛土等又は土石の堆積" },
      { id:"h13-02", q:"2 基本方針・基礎調査",
        a:"基本方針：主務大臣（国交大臣及び農林水産大臣）は宅地造成・特定盛土等・土石の堆積に伴う災害の防止に関する基本方針を定めなければならない\n基礎調査：都道府県等は、基本方針に基づき、**5年ごと**に、対策に必要な基礎調査を行う\n土地の立入り：都道府県知事等は、基礎調査のために測量や調査を行う必要があるときは、必要の限度において、自ら立入り、または命じた者に立ち入らせることができる（立入りの**3日前**までに通知）\n立入りに伴う損失補償：都道府県は、立入りにより他人に損失を与えたときは、通常生ずべき損失を補償しなければならない",
        trap:"土地の占有者は、正当な理由がない限り、立入りを拒んだり妨げたりしてはならない。" },
      { id:"h13-03", q:"3 規制区域",
        a:"宅地造成等工事規制区域：宅地造成、特定盛土等又は土石の堆積に伴い災害が生ずるおそれが大きい市街地等区域（市街地、市街地となろうとする土地の区域、集落の区域で隣接、近接する区域を含む）であって、宅地造成等に関する工事について規制を行う必要があるもの\n\n特定盛土等規制区域：宅地造成等工事規制区域以外の土地であって、土地の傾斜度、渓流の位置その他の自然的条件及び周辺地域における土地利用の状況その他の社会的条件からみて、区域内の土地において特定盛土等又は土石の堆積が行われた場合には、災害により居住者等の生命又は身体に危害を生ずる恐れが特に大きいと認められる区域\n\n指定権者：都道府県知事（都市計画区域の内外を問わない）" },
      { id:"h13-04", q:"4 宅地造成等工事規制区域　許可制",
        a:"宅地造成等工事を行う場合、工事主は知事の許可が必要（知事は許可するにあたり条件をつけることができる）。\n\n許可不要の場合：①国や地方公共団体等が行う非常災害のための必要な応急措置②工事の施行に付随して、使用する土石または発生した土石を、工事現場やその付近に一時的に堆積するもの\n\n許可とみなされる場合：①国や都道府県等が行う場合は、知事との協議の成立をもって許可があったものとみなされる②宅地造成等工事規制区域の指定後に都市計画法の開発許可を受けた場合" },
      { id:"h13-05", q:"許可基準・許可後の工事",
        a:"知事は、許可申請があったときは、遅滞なく、許可又は不許可の処分をしなければならない。許可をした時は許可証を交付する、不許可としたときは文書で通知。工事は許可証の交付を受けた後でなければすることはできない。\n\n許可基準：①災害防止のための技術的基準（高さ**5m超**の擁壁の設置工事等は一定の資格を有する者の設計によらなければならない）②工事主に資金・信用があること③工事施行者に工事を完成させるために必要な能力があること④土地の所有者等全員の同意" },
      { id:"h13-06", q:"工事主の義務（標識・報告・中間検査・変更・完了検査）",
        a:"工事主は、工事現場の見やすい場所に標識（工事主の氏名・名称・住所、工事施行者の氏名・名称等）を掲示しなければならない。\n一定規模の工事は、実施状況について知事に**3ヶ月ごと**に報告。\n中間検査：一定規模の工事に、工事完了後に確認が困難となるような特定工程（例：排水施設の設置）を含む場合は、その工事を終えた日から**4日以内**に、その都度知事の検査を申請しなければならない。\n計画を変更する場合は知事の許可が必要（軽微な変更は届出で足りる）。\n完了検査：工事が完了したら、完了した日から**4日以内**に、技術的基準に適合しているかどうかについて、知事の検査を申請しなければならない。",
        trap:"土石の堆積に関する工事を完了した時は、4日以内に、堆積されていた全ての土石の除去が行われたかどうかについて、知事の確認を申請しなければならない。\n知事は、基準に適合していれば検査済証を交付しなければならない。" },
      { id:"h13-07", q:"5 特定盛土等規制区域",
        a:"届出制：特定盛土等又は土石の堆積を行う場合、工事主は、工事に着手する日の**30日前**までに知事に届け出なければならない（届出不要の場合は宅地造成等工事規制区域の許可制と同様）\n\n計画を変更する場合は、変更後の工事に着手する30日前までに、知事に届け出なければならない（一定の軽微な変更は届出も不要）。\n\n許可制：特定盛土等又は土石の堆積（大規模）を行う場合、工事主は知事の許可が必要（許可不要の場合やその後の手続きは宅地造成等工事規制区域と同じ）",
        trap:"知事は届出を受理した時は、工事主の氏名や届出地などの一覧を公表し、関係市町村に通知。" },
      { id:"h13-08", q:"6 規制区域内での監督処分",
        a:"許可後（工事主）：不正な手段で許可を受けた・許可の条件に違反→**許可の取消し**\n工事中（工事主・工事請負人・現場管理者）：無許可で工事・許可の条件に違反・技術的基準に不適合→**工事停止命令**、擁壁等の設置等の災害防止のため必要な措置命令\n工事終了後（工事主、所有者・管理者・占有者）：無許可で工事・中間検査/完了検査を受けていない・技術的基準に不適合→**宅地の使用禁止**、擁壁等の設置、災害防止措置",
        trap:"処分される前に弁明の機会が付与される（工事停止命令で緊急の必要があり、違反していることが明らかな時は不要）。" },
      { id:"h13-09", q:"7 規制区域内での届出制（既存工作物等）",
        a:"高さ**2m**を超える擁壁、崖面崩壊防止施設等、排水施設、地滑り抑止ぐい等の除却工事を行おうとする者→工事着手の**14日前**まで\n公共施設用地を宅地または農地等に転用→転用後**14日以内**\n規制区域に指定された際に現に工事中→指定後**21日以内**",
        trap:"知事は届出を受理した時は、工事主の氏名や土地の所在地などの一覧を公表し、関係市町村に通知しなければならない。" },
      { id:"h13-10", q:"8 規制区域内の保全義務等",
        a:"① 保全義務：所有者・管理者・占有者は、宅地造成等（区域の指定前に行われたものも含む）に伴う災害が生じないように、土地を常時安全な状態に維持するように努めなければならない\n② 保全勧告：知事は、災害防止のため必要があるときは、所有者・管理者・占有者・工事主・工事施行者に対し、擁壁や排水施設の設置・改造などの必要な措置をとることを勧告することができる\n③ 改善命令：知事は、災害発生のおそれが大きい場合は、所有者・管理者・占有者に対して、擁壁や排水施設等の工事を命じることができる。工事施行者に対して改良工事を命じることができる",
        trap:"知事は、規制区域内における宅地の所有者・管理者・占有者に対して、土地や工事の状況について報告を求めることができる。" },
      { id:"h13-11", q:"9 造成宅地防災区域",
        a:"区域の指定：知事は、必要があると認めるときは、宅地造成または特定盛土等（宅地において行うものに限る）に伴う災害で、相当数の居住者に危害を生ずるおそれの大きい一団の造成宅地の一定の場所を指定する（宅地造成等工事規制区域内を除く）\n\n災害防止措置等：①保全義務＝所有者・管理者・占有者②保全勧告＝所有者・管理者・占有者③改善命令＝所有者・管理者・占有者・工事施行者" }
    ]},
    { id:"h14", title:"その他の法令", items:[
      { id:"h14-01", q:"許可制・届出制の主体一覧",
        a:"許可制：【管理者】海岸法、港湾法、河川法、津波防災法、道路法／【市町村長】生産緑地法／【市町村長】森林法（民有林の伐採の場合のみ）\n\n届出制：【知事】土砂災害防止法（特定開発行為の廃止）、土壌汚染対策法、都市緑地法、廃棄物処理法、公有地拡大推進法／【景観行政団体の長】景観法" },
      { id:"h14-02", q:"自然公園法",
        a:"環境大臣の許可：国立公園内の普通地域以外\n知事への届出：国定公園内の普通地域\n環境大臣への届出：国立公園内の普通地域" },
      { id:"h14-03", q:"文化財保護法",
        a:"文化庁長官の許可：その他\n文化庁長官へ届出：重要文化的景観の変更・保存に影響する行為" }
    ]}
  ] },
  { id:"zei",    no:"③", name:"税その他",     color:"#B07612", themes:[
    { id:"z01", title:"第1章 不動産取得税・固定資産税", items:[
      { id:"z01-01", q:"概要の比較（主体・客体・納税義務者・非課税）",
        a:"不動産取得税：主体＝都道府県／客体＝所有権の取得（売買、贈与、増築、改築、登記は関係なし）／納税義務者＝所有権を取得した人（使用・譲渡していない新築は6ヶ月後から課税、宅建業者の場合は1年）／非課税＝相続、合併、国や地方公共団体\n\n固定資産税：主体＝市町村／客体＝土地、建物、償却資産（事業用の機械や車両）／納税義務者＝1月1日に所有者として登記されている者に全額課税（登記未了の場合は補充課税台帳に記録されているもの）、質権者、100年以上の地上権者、共有者は連帯・マンションは持分割合で按分／非課税＝国や地方公共団体\n\n納税方法はいずれも普通徴収。",
        trap:"改築した場合の不動産取得税は、改築により家屋の価値が増加した場合に限られる。\n固定資産税の納期は2・4・7・12月のうち市町村が条例で定める（特別の事情があれば異なる納期も可）。" },
      { id:"z01-02", q:"税額の比較　免税点・課税標準",
        a:"免税点（未満）：不動産取得税＝土地10万・新築改築増築による家屋23万・売買交換贈与による家屋12万／固定資産税＝土地30万・家屋20万・償却資産150万（同じ市町村内のは合算して判断）\n\n課税標準：不動産取得税＝原則、固定資産課税台帳の登録価格（①住宅（50㎡以上240㎡以下）取得の特例＝新築は個人・法人とも**1200万控除**、中古は個人の居住用のみ経過年数に応じて控除（最高1200万）／②宅地取得の特例＝登録価格を1/2）\n固定資産税＝原則、固定資産課税台帳の登録価格（価格は3年ごとに変更、3年以内で変更することもある）（①住宅用地の特例（空家は対象外）＝200㎡以下は登録価格×1/6、200㎡超は登録価格×1/3）" },
      { id:"z01-03", q:"税額の比較　税率・税額",
        a:"税率：不動産取得税＝原則4%（土地・住宅は3%）／固定資産税＝1.4%（条例で増税できる）\n\n税額の特例（固定資産税）：50㎡以上280㎡以下の新築住宅は120㎡までの部分について**1/2**（3階以上の中高層耐火→**5年間**、その他→**3年間**）" },
      { id:"z01-04", q:"固定資産税の課税標準について",
        a:"総務大臣が定める固定資産評価基準をもとに、市町村長は固定資産の価格を毎年**3月31日**までに決定する（縦覧帳簿を作成し、一定期間、納税者の縦覧に供する）。\n市町村長は納税義務者（借地権者・借家権者含む）の求めに応じ、固定資産課税台帳のうち自己に係る部分を閲覧に供しなければならない（一定事項が記載された証明書も交付可能）。\n価格に不服がある場合は固定資産評価審査委員会に申し出る。" }
    ]},
    { id:"z02", title:"第2章 所得税", items:[
      { id:"z02-01", q:"1 譲渡所得の算定",
        a:"所有期間**5年以下**→税率**30%**（短期譲渡所得）\n所有期間**5年超**→税率**15%**（長期譲渡所得）" },
      { id:"z02-02", q:"2 軽減税率",
        a:"居住用財産を譲渡（所有期間**10年超**）：6000万を超える部分→15%／6000万以下の部分→**10%**（適用要件は3000万円特別控除と同じ。ただし配偶者、直系血族等への譲渡は×）\n\n優良住宅地造成のための土地の譲渡（所有期間5年超）：2000万を超える部分→15%／2000万以下の部分→**10%**",
        trap:"唯一併用できるのは軽減税率（居住用）と特別控除の組み合わせだけ。" },
      { id:"z02-03", q:"3 特別控除",
        a:"収用交換（公共事業）→**5000万**の特別控除\n居住用財産→**3000万**の特別控除（複数の資産の譲渡でも合計5000万円が限度）",
        trap:"同一年に長期譲渡所得と短期譲渡所得の両方がある場合は、まず短期から控除される。" },
      { id:"z02-04", q:"3000万円特別控除　できる場合・できない場合",
        a:"できる場合：①現に居住している家屋の譲渡②居住しなくなった日から**3年目の年末**までに譲渡③相続した空き家を売却\n\nできない場合：①配偶者、直系血族、生計を一にする親族・内縁関係者へ譲渡した場合②**3年以内**に3000万円特別控除や買換え特例を受けた場合" },
      { id:"z02-05", q:"4 買換え特例",
        a:"今より高いのに買換え→課税されない\n今より安いのに買換え→差額に課税" },
      { id:"z02-06", q:"5 住宅ローン控除",
        a:"控除対象：住居を取得または増改築をした場合／取得後**6ヶ月以内**に居住し適用を受ける年末まで居住／返済期間が**10年以上**の住宅ローン／所得金額が**2000万円以下**\n\n対象住宅：床面積が**50㎡以上**（所得1000万円以下は40㎡以上）／床面積の1/2以上を居住用として使用／（中古）新耐震基準に適合／（新築）省エネ基準を満たした認定住宅であること\n\n控除期間：新築は**13年間**、中古は**10年間**　控除額：**0.7%**",
        trap:"前々年から翌年以後3年以内までの間に①3000万特別控除②軽減税率③買換え特例を受けた場合は住宅ローンとの併用不可。\n収用交換の5000万特別控除、居住用財産の買換え等の場合の譲渡損失の損益通算及び繰越控除と住宅ローンは併用可。" }
    ]},
    { id:"z03", title:"第3章 印紙税", items:[
      { id:"z03-01", q:"1 課税文書",
        a:"課税文書：①契約書②仮契約書③覚書④受取書（領収書）\n\n非課税：①**5万円未満**の受取書②営業に関しない受取書③建物の賃貸借契約書・抵当権設定契約書" },
      { id:"z03-02", q:"2 課税の重要ルール",
        a:"複数の金額が記載：合計額に課税\n消費税が区別して記載：消費税は含まない\n金額が記載されていない場合：印紙税は**200円**（贈与など）\n変更契約書：金額増加→増加した分に課税／金額減少→200円\n交換契約書：双方の金額が記載→高い金額に課税／差額のみ記載→差額に課税\n売買と請負が併記：売買契約として課税（ただし、請負金額の方が高い場合は請負金額に課税）\n地上権または土地の賃借権の設定・譲渡：権利金・礼金に課税（賃料、敷金は記載金額のないものとして扱う）" },
      { id:"z03-03", q:"3 納付",
        a:"課税文書の作成者が連帯して納付。\n文書1通ごとに納付（3通作成したら3つ分を納付）。\n国と私人が契約した場合、私人が保存する文書には印紙不要。\n消印は代理人・使用人・従業員の印章でも可。",
        trap:"印紙の添付漏れは過怠税として**3倍**払う（自己申告した場合は**1.1倍**）。" }
    ]},
    { id:"z04", title:"第4章 登録免許税", items:[
      { id:"z04-01", q:"1〜3 概要・課税標準・税率",
        a:"概要：不動産登記を受ける者が国に納める（表示に関する登記は非課税。共同申請の場合＝登記を受ける者が2人の場合は2人で連帯して納付）\n\n課税標準：固定資産課税台帳に登録されている価格\n\n税率：所有権移転登記（原則）＝**20/1000**（参考）／住宅用家屋の特例＝**3/1000**（参考）" },
      { id:"z04-02", q:"建物の特例",
        a:"新築または取得（◯売買　◯競落　×贈与　×交換　×相続）する住宅用家屋であって次の要件を満たすもの（再適用可）：①個人の居住用として自己使用②**1年以内**に登記③床面積**50㎡以上**④新耐震基準に適合" },
      { id:"z04-03", q:"4 納付方法",
        a:"納税地：登記所の所在地（×納税義務者の住所地）\n納付時期：登記を受けるとき\n納付方法：現金納付（**3万円以下**は印紙で可）" }
    ]},
    { id:"z05", title:"第5章 相続税・贈与税（参考）", items:[
      { id:"z05-01", q:"1 相続税の基礎控除",
        a:"**3000万＋（600万円×法定相続人の数）**" },
      { id:"z05-02", q:"2 贈与税",
        a:"贈与によって財産を取得した個人に課される国税。" },
      { id:"z05-03", q:"3 住宅取得資金の贈与を受けた場合の相続時精算課税の特例",
        a:"概要：祖父母や親から**18歳以上**の子や孫が住宅取得等資金の贈与を受けた場合、贈与時に軽減された贈与税を納付し、相続税で残余部分を精算するもの（**2500万**までは非課税、2500万を超える部分は**20%**、基礎控除年110万）\n\n要件：①住宅取得等資金（100万円以上の増改築含む）の贈与②床面積**40㎡以上**③床面積の1/2以上が自己の居住用に供される④贈与を受けた翌年**3月15日**までに取得の資金にあて居住⑤新耐震基準に適合" }
    ]},
    { id:"z06", title:"第6章 不動産鑑定評価基準", items:[
      { id:"z06-01", q:"1 求める価格",
        a:"正常価格：合理的市場の市場価値を表示する適正な価格\n限定価格：市場（買主）が限定される場合の価格（例：隣地の価格）\n特定価格：市場価値と乖離することとなる場合の経済価値を適正に表示する価格、市場性を有する不動産（例：証券化不動産に係る鑑定評価目的の下で投資家に示す価格）\n特殊価格：その利用状況を前提とした経済価値を表示する価格、市場性を有しない不動産（例：お寺、文化財）" },
      { id:"z06-02", q:"2 求める手段　原価法",
        a:"対象不動産の再調達原価（＝新しく作り直す価格）を求め、減価修正（耐用年数、観察減価＝年数や損傷を差し引く）を行い価格を求める方法。\n◯建物　◯造成地・埋立地　×既成市街地の土地",
        trap:"街が便利になっていたら熟成度を加算できる。" },
      { id:"z06-03", q:"取引事例比較法",
        a:"多数の取引事例について、事情補正（＝特殊な事情を補正すること）、時点修正（＝物価の変動を修正すること）、地域要因・個別要因を比較して価格を求める方法。\n◯近隣地域、同一需給圏内の類似地域（やむを得ない場合は近隣地域の周辺地域）で取引が行われている場合\n×取引のない地域の不動産（例：農地）　×取引の少ない不動産（例：神社）",
        trap:"投機的な取引事例は参考不可。" },
      { id:"z06-04", q:"収益還元法",
        a:"対象不動産が将来生み出す純収益の総和を基準に価格を求める方法（直接還元法とDCF法の2種）。\n◯自用の不動産　×賃料を観念できない文化財等",
        trap:"取引価格が急上昇している場合は収益還元法を使うと適切な価格を検証しやすい。" }
    ]},
    { id:"z07", title:"第7章 地価公示法", items:[
      { id:"z07-00", q:"地価公示法とは",
        a:"土地の価格を判定して、価格を国民に公表する手続き。" },
      { id:"z07-01", q:"標準地の選定",
        a:"土地鑑定委員会が、公示区域内（都市計画区域内外）から選定する。\n類似の利用価値を有する地域において、土地の利用状況、環境等が通常と認められる一団の土地について選定しなければならない。" },
      { id:"z07-02", q:"鑑定評価",
        a:"2人以上の不動産鑑定士が、①近傍類地の取引価格から算定される推定価格②近傍類地の地代から算定される推定価格③同等の土地を造成する推定費用の3つの価格を勘案して鑑定を行う。" },
      { id:"z07-03", q:"審査・判定・公示",
        a:"審査・判定：土地鑑定委員会は鑑定評価書を元に判定を行う。\n公示：土地鑑定委員会は、毎年**1回**、**1月1日**の、1㎡当たりの「正常価格」を官報で公示する。",
        trap:"正常価格とは、自由な取引で通常成立する更地価格のことで建物や借地権等はないものとして判定する。" },
      { id:"z07-04", q:"官報で公示する事項・送付閲覧",
        a:"①標準地の単位面積あたりの価格（正常価格）②価格判定の基準日③標準地の地積及び形状④標準地及び周辺の土地利用の現況\n\n土地鑑定委員会は関係市町村長に書面等を送付し、市町村長は事務所で**3年間**一般の閲覧に供する。" },
      { id:"z07-05", q:"地価公示の効力（規準）",
        a:"①土地の取引をする者→指標として努めなければならない\n②不動産鑑定士の鑑定評価\n③収用の取得価格\n④収用の補償金",
        trap:"規準とは、当該土地とこれに類似の1または2以上の標準地との比較を行い公示価格との均衡を保たせること。" }
    ]},
    { id:"z08", title:"第8章 住宅金融支援機構法", items:[
      { id:"z08-01", q:"1 7つの業務　① 証券化支援業務",
        a:"金融機関が有する住宅ローン債権を→譲受ける（買取型）／→保証する（保証型）。\n債権を証券化（MBS）して資金を調達。" },
      { id:"z08-02", q:"フラット35　融資対象者・目的",
        a:"融資対象者：原則**70歳未満**\n\n融資の目的：◯本人または親族居住の住宅の建設・購入資金　◯住宅の購入・建設に付随する土地や借地権の取得　◯借換え　◯中古住宅購入に付随するリフォーム　◯高齢者が行う自宅の改良\n×土地のみの購入資金　×リフォームのみ　×賃貸住宅を建設・購入するための資金" },
      { id:"z08-03", q:"フラット35　対象住宅・融資金額・借入期間・金利",
        a:"対象住宅：◯戸建て**70㎡以上**　マンション**30㎡以上**　◯住宅部分の床面積が1/2以上の店舗兼住宅　◯中古住宅\n融資金額：**100万円〜8000万円**（建設・購入金額の全額でもOK）\n借入期間（以下のうち短い方）：**15年以上35年以内**　or　完済時**80歳**\n金利：固定金利・金融機関によって異なる" },
      { id:"z08-04", q:"フラット35S・フラット50",
        a:"フラット35S：省エネ・耐震性・バリアフリーなどに優れた住宅を取得するときは、金利が一定期間下がる。\nフラット50：認定長期優良住宅の購入については上限**50年**ローン。" },
      { id:"z08-05", q:"② 融資保険業務・③ 情報提供",
        a:"融資保険業務：住宅ローン債務者が滞納した場合に、住宅融資保険による保険金を支払う。\n\n情報提供：⑴住宅ローン等に関する情報提供（住宅の建設・購入・改良・移転する者に対し、資金の調達や良質な設計に関する情報提供や援助を行う）／⑵空家等の融資に関する情報提供（空家及び空家の跡地の活用促進に必要な資金の融通に関する情報提供や援助を行う）" },
      { id:"z08-06", q:"④ 直接融資業務",
        a:"⑴災害関連：災害復興建築物や災害予防代替建築物の建設購入、被災建築物の補修、災害予防関連工事、地震に対する安全性の向上のための住宅改良\n⑵合理的土地利用建築物の建設（マンションの建替え）、マンション共用部の改良\n⑶子育てや高齢者に適した賃貸住宅の建設・改良\n⑷高齢者が自ら居住する自宅の改良（＜高齢者向け返済特例制度＞元金は死亡時に一括して返済し、月々は利息だけ支払えばよい制度）\n⑸住宅のエネルギー消費性能の向上を主たる目的とする住宅の改良に必要な資金の貸付け\n⑹勤労者財産形成促進法の規定による財形住宅貸付\n⑺マンションの更新（一棟リノベーション工事）、要除却等認定マンションの除却（取壊し）" },
      { id:"z08-07", q:"⑤ 団体信用生命保険・⑥ 既存債権の管理回収・⑦ 住生活の安定確保",
        a:"団体信用生命保険：融資を受けた者が死亡や重度障害になった場合に支払われる生命保険金を債務の弁済にあてる。\n既存債権の管理回収：住宅金融公庫（前の団体）から承継した債権の管理・回収。\n\n住生活の安定確保：＜住宅セーフティーネット＞住宅確保要配慮者の入居を拒まない賃貸住宅の改良に必要な資金の貸付、家賃保証会社が住宅確保要配慮者の家賃を保証する場合にその保証の保険を引き受ける／＜高齢者の住居の安定確保＞高齢者向け住宅の入居につき前払金貸付けについて保険を行う、前払金貸付けに関する貸付債権の譲受け及び債務の保証" },
      { id:"z08-08", q:"2 業務の委託",
        a:"委託できる業務：①貸付債権の回収②直接融資業務③団信生命保険の弁済業務④建築物の審査⑤構造計算の審査\n委託先：金融機関、地方公共団体、債権回収会社、法人",
        trap:"×貸付の決定　×情報提供業務は委託できない。委託先ごとにできる業務はそれぞれ異なる。" }
    ]},
    { id:"z09", title:"第9章 景品表示法・公正競争規約", items:[
      { id:"z09-01", q:"1 不当表示の禁止",
        a:"① 品質について、実際より著しく優良、他社より著しく優良であると誤認される表示\n② 価格について、実際のもの、または他社より著しく有利であると誤認される表示" },
      { id:"z09-02", q:"2 広告規制　対象・開始時期・おとり広告",
        a:"広告・表示→パンフレット、看板、インターネット、モデルルームを含む\n広告開始時期→工事完了前は必要な許可処分等があった後でなければ広告できない\nおとり広告→×実在しない物件　×取引する意思のない物件　×取引できない物件" },
      { id:"z09-03", q:"二重価格表示",
        a:"二重価格を表示するときは、事実に相違する広告表示、他社より有利と誤認されるおそれのある広告表示をしてはならない。\n\n過去の販売価格を載せる場合の要件：①過去の販売価格の公表日、値下げした日を明示②直前の価格で、**2ヶ月以上**実際に販売していた価格であること③値下げから**6ヶ月以内**に表示する④物件の価値に同一性が認められるもの⑤土地又は建物について行う表示であること",
        trap:"賃貸物件の賃料の二重表示は不可。" },
      { id:"z09-04", q:"誇称表現・取引態様・本広告の媒体",
        a:"「業界一」「特選」「最高」「激安」などは裏付ける合理的な根拠を示す資料を有していれば使用できる（「最高」「激安」は根拠となる事実を併せて表示する）。\n取引態様：「売主」「貸主」「媒介」「仲介」「代理」など取引態様を明示しなければならない（×直販　×委託）。\n本広告を実施すべき広告媒体：予告広告後の「本広告」を実施すべき媒体について、予告広告と同一の媒体で実施する場合に加えて、インターネット広告のみでも可能。" },
      { id:"z09-05", q:"3 土地に関するもの　区域・接道・セットバック",
        a:"市街化調整区域：「市街化調整区域内、宅地の造成および建物の建築はできません」と**16ポイント以上**の文字で明示する\n接道義務違反：道路に**2m以上**接していない土地は「再建築不可」または「建築不可」と明示する\nセットバック義務：セットバックを要する土地については「その旨」を表示し、その部分が**10%以上**の場合は「面積」も明示する" },
      { id:"z09-06", q:"傾斜地・路地状部分・高圧電線路下等",
        a:"傾斜地：①傾斜地の割合が**30%以上**の土地を販売する場合、傾斜地を「含む旨」及びその「割合または面積」を明示する（マンションおよび別荘地等を除く）②傾斜地を含むことにより土地の有効な利用が著しく阻害される場合①と同様の表示をしなければならない（マンションを除く）\n\n路地状部分のみで接道する土地：路地状部分の面積が**30%以上**を占める時は「その旨」及びその「割合または面積」を明示しなければならない\n\n高圧電線路下：土地の全部又は一部が高圧電線路下にあるときは「その旨」「面積」、建築が禁止されている時は「その旨」も併せて明示する\n\n古家・廃屋：土地取引で存在する時は「その旨」を表示\n温泉：加温・加水したものについては「その旨」を表示\nがけの土地：土地が擁壁によっておおわれないがけの上又はがけの下にあるときは、その旨を明示、建物を建築する場合に制限が加えられているときはその内容も併せて明示する" },
      { id:"z09-07", q:"4 建物に関するもの　新築・新発売・価格",
        a:"新築：建築工事完了後**1年未満**であって未入居のもの\n新発売：新築の住居・土地・一棟リノベーションマンションについて初めて購入の申込みの勧誘を行うこと（数期に分けて販売する場合はその期ごとの勧誘）\n\n価格：全ての住戸の価格を表示する必要がある。ただし、新築分譲住宅・新築分譲マンション・一棟リノベーションマンションの価格については、全ての価格の表示が困難なときは、パンフレット等の媒体を除き、「最低価格」「最高価格」「最多価格帯」「その価格帯の戸数」を表示することができる（**10戸未満**であるときは最多価格帯の表示を省略することができる）。\n管理費・修繕費：1戸あたりの月額の表示が困難な場合は「最低額」「最高額」のみ表示" },
      { id:"z09-08", q:"工事の中断・増改築・面積",
        a:"工事の中断：着手後に、工事を相当期間にわたり中断した住宅は、建築工事に着手した時期および中断していた期間を明示しなければならない。\n増改築：増改築した場合は「その内容」「時期」を表示（新築と誤認させてはならない）。\n\n面積：延べ面積を表示し、車庫・地下室を含むときは「その旨」「面積」を表示する（取引する全ての建物の面積を表示する必要がある。ただし、新築分譲住宅、新築分譲マンション、一棟リノベーションマンション、新築賃貸マンション等については、パンフレット等の媒体を除き、最小建物面積及び最大建物面積のみで表示することができる）" },
      { id:"z09-09", q:"LDK・納戸・写真・物件名称",
        a:"LDK：居間と食堂と台所を備えているもの\n納戸：採光・換気のための開口部が一定割合に達しないため居室と認められない部分（居室と表示してはならない）\n未完成物件の写真・動画：当該写真が他の建物である旨を明示して規模・形質等が同一の外部写真・内部写真を用いることができる（施行者が過去に施工したものに限る）\n物件名称の使用基準：物件が海（海岸）、湖沼、河川の岸、堤防から直線距離で**300m以内**、街道から直線距離で**50m以内**であればこれらの名称も使用できる" },
      { id:"z09-10", q:"5 周辺環境に関するもの　交通機関",
        a:"交通機関：電車、バス等は現に利用できるものを表示し、特定の時期にのみ利用できるものは利用できる時期を明らかにする\n電車の所要時間：朝の通勤ラッシュ時の所要時間を明示し、平常時の所要時間をその旨を明示して併記できる（乗換えを要するときは、その旨を明示し、所要時間に乗換えに概ね要する時間を含める）\n新設予定の駅：運行主体が公表したものに限り、予定時期を明らかにして表示できる（新設の路線については国交大臣の許可や協定の内容を明示して表示することができる）" },
      { id:"z09-11", q:"駅までの距離・徒歩所要時間・施設",
        a:"駅までの距離：公共交通機関を利用することが通例である場合には、最寄駅の名称及び徒歩所要時間を明示する（マンションアパートについては建物の出入り口を起点とする。物件→最寄駅の順）\n団地との距離・時間：最も近い団地内の区画までと最も遠い区画までを併記する\n徒歩の所要時間：**80mにつき1分**で算出する（1分未満の端数は1分と算出）\n自転車の所要時間：道路距離を明示して通常要する走行時間を表示\n商業施設：現に利用できるものを物件からの距離又は徒歩所要時間にして表示する（未完成のものは将来確実に利用できると認められるものに限り整備予定時期を明らかにして表示できる）\n公共施設（学校・病院・公園）：現に利用できるものを表示し、物件からの距離又は徒歩所要時間を明示しなければならない。原則として施設の名称を表示する。",
        trap:"道路距離又は所要時間を表示するときは、起点及び着点を明示して表示すること。物件の起点は、物件の区画のうち駅その他施設に最も近い地点（マンションにあっては建物の出入口）とし、駅その他の施設の着点は、その施設の出入口とする。" }
    ]},
    { id:"z10", title:"第10章 土地・建物", items:[
      { id:"z10-01", q:"1 土地　⑴ 地形の種類（低地）",
        a:"低地：洪水、津波や地震に弱く宅地として適していない。ただし自然堤防、扇状地は比較的宅地に向く（扇状地は集中豪雨で土石流が発生する可能性がある）。",
        trap:"水田や宅地として利用され、大都市の大部分も低地にある。" },
      { id:"z10-02", q:"丘陵地・台地・段丘",
        a:"水はけがよく、地耐力もあり洪水や地震にも強いので宅地として適している。",
        trap:"縁辺部はがけ崩れの危険がある。\n谷は軟弱地盤であることが多い。" },
      { id:"z10-03", q:"山麓部・埋立地・干拓地",
        a:"山麓部：地すべりや土石流が起こることがあり宅地には適していない。\n埋立地と干拓地：地震の時に液状化しやすく宅地に不向き。",
        trap:"埋立地は海面より高さがあるので干拓地よりは安全。" },
      { id:"z10-04", q:"⑵ 等高線の特徴",
        a:"① 小さい円が頂上\n② 間隔が狭いところが急斜面\n③ 山頂から見て等高線が張り出している部分は尾根で、逆は谷" },
      { id:"z10-05", q:"⑶ 災害　地すべり・土石流",
        a:"地すべり地の多くは過去にも地すべりを起こしている（棚田などの水田として利用されることもある）。\n山から崩れ落ちてきた砂や小石に覆われた地域は、切土をすると崩壊や地すべりを起こしやすく、集中豪雨の時には土石流が発生する危険がある。",
        trap:"がけ崩れは豪雨によって発生することが多い。\n土石流は河川流域内で豪雨に伴う斜面崩壊の危険の高いところで起こる。" },
      { id:"z10-06", q:"液状化・不同沈下",
        a:"液状化：地震により砂質地盤が液体のように噴き出す現象。比較的粒径のそろった砂地盤で、地下水位の高い、地表から浅い地域で発生しやすい（埋立地、三角州、後背湿地、浅い谷など軟弱な地盤でおきやすい）。\n\n不同沈下：地盤が建物の重みで部分的に沈むこと。",
        trap:"切土と盛土により造成した地盤の境目は不同沈下が起こりやすい。切土よりも盛土で起こりやすい。\n高さ2m以下の擁壁であっても、水抜き穴を設置することが望ましい。" },
      { id:"z10-07", q:"2 建物　⑴ 建築材料　木材",
        a:"水を含むと強度が弱くなる。湿った状態だと白アリや腐朽菌の害を受けやすい。圧縮やひっぱりには強いが、曲げに弱い。\n集成木材は単板を積層したもので、伸縮、変形、割れが生じにくくなるため大規模な木造建築物の骨組みに使用される。" },
      { id:"z10-08", q:"鋼材（鉄骨）",
        a:"熱に弱いため鉄骨構造を耐火構造にするには耐火被覆をする必要がある。錆びやすいので鋼材の防錆処理を行う必要がある。\n鉄筋コンクリートよりも自重が小さく、木造と比べて靭性が大きいことから大空間の建築や高層建築に使用される。",
        trap:"炭素含有量が多いほど引張強度・硬度が増大する。" },
      { id:"z10-09", q:"鉄筋とコンクリートの相性",
        a:"コンクリートは圧縮強度は強いが引張強度は弱い。鉄筋とコンクリートを比較すると、熱膨張率がほぼ等しい。" },
      { id:"z10-10", q:"ラーメン構造・ブレース構造",
        a:"ラーメン構造：柱を鉛直方向、梁を水平方向に配置し、接合部を強く固めて（剛接合）組み合わせた直方体の構造形式（柱と梁が一体化しているため、水平方向に力が掛かっても変形しにくく、地震による横揺れに対しては建物全体で耐える構造になっている）\n\nブレース構造：柱や梁の対角線上に斜め部材を入れた構造形式（四角形を補強し、耐震性を高める。骨組みすべてに用いることは少なく、ラーメン構造と併用することもある）" },
      { id:"z10-11", q:"⑵ 建築物の補強方法　木造建築物",
        a:"① 接合部は金物等で緊結する\n② 屋根を軽量にする\n③ 真壁造りより大壁造りの方が耐震性がある\n④ 1階、2階を通し柱にする\n⑤ コンクリート造りの布基礎（連続基礎）にアンカーボルトで緊結する" },
      { id:"z10-12", q:"コンクリートの補強",
        a:"耐火性、耐久性、耐震性、耐風性に優れている。鉄が錆びると耐久性に影響を及ぼすので中性化を防止する必要がある。コンクリートに酸や塩分が含まれないようにする。\nコンクリートのかぶり厚さは、耐力壁にあっては**3cm以上**としなければならない。鉄筋コンクリートにするには丸鋼より異形鉄筋がよい。",
        trap:"近年では鉄筋コンクリート造の超高層共同住宅建物も建設される。" },
      { id:"z10-13", q:"コンクリートブロックの補強",
        a:"コンクリートブロック造を鉄筋コンクリートで耐震的に補強したものを補強コンクリートブロック造という（壁式構造の一種）。\n壁式構造は強固で耐震性に優れているが、高層になると強度を維持できないことから、中低層マンションや、小規模な建物に利用される。" },
      { id:"z10-14", q:"⑶ 基礎　杭基礎・直接基礎",
        a:"杭基礎：地盤が軟弱な場合に杭を地面に差し込む。支持杭＝杭を使い、深い位置の硬い層で支持する／摩擦杭＝杭周面の摩擦力で建物を支える",
        trap:"支持杭と摩擦杭を混用してはならない。" },
      { id:"z10-15", q:"直接基礎の種類",
        a:"地盤が良好で地耐力が高い場合に、地盤に直接基礎を作る。\n① ベタ基礎…床下全面をコンクリートで覆う\n② 布基礎…柱や壁の下に連続して基礎を設置する\n③ 独立フーチング基礎…主な柱の下にだけ基礎を設置する" }
    ]}
  ] },
  { id:"minpo",  no:"④", name:"民法",         color:"#8A3B8F", themes:[
    { id:"ch16", title:"第16章 賃貸借契約", items:[
      { id:"m16-01", q:"1 存続期間",
        a:"⑴ 期間を定める場合：最長期間**50年**／最短期間　制限なし\n⑵ 期間を定めない場合：いつでも解約の申入れによって終了する（土地＝**1年後**に終了／建物＝**3ヶ月後**に終了）",
        trap:"期間を定める場合、中途解約は認められない。" },
      { id:"m16-02", q:"2 賃貸人の義務　⑴ 目的物の修繕義務",
        a:"賃貸人は賃借人に使用・収益させる義務があるので、必要な場合は修繕をしなければならない（賃借人は賃貸人が行う修繕行為を拒むことはできない）。\n①急迫の事情があるとき②賃貸人に修繕の必要性を通知したにもかかわらず相当の期間内に修繕をしないときは、賃借人が修繕できる。" },
      { id:"m16-03", q:"2 賃貸人の義務　⑵ 必要費と有益費",
        a:"賃借人が修繕を行った場合は、賃貸人は費用を支払わなければならない。\n必要費：普通に使うのに必要な費用　→支出後**直ちに**請求できる\n有益費：目的物の価値を増加させる費用　→**契約終了時**に請求できる（支出額と価値増加額のどちらかを賃貸人が選択）" },
      { id:"m16-04", q:"3 賃借人の義務",
        a:"賃料支払義務：特約がなければ後払い\n保管義務・返還義務：目的物が全部滅失したら賃貸借契約は終了\n原状回復義務：賃貸借が終了したときは損傷を原状に復さなければならない",
        trap:"原状回復義務を負わない場合：賃借人の責めに帰すことができない事由／通常の使用で生じた消耗や経年変化。" },
      { id:"m16-05", q:"4 譲渡・転貸",
        a:"賃借権を譲渡・転貸するには賃貸人の承諾が必要。無断で行うと契約解除される（背信行為にあたらない場合を除く）。\n\n転貸の場合の注意点：\n・CはAに対してBの債務の範囲を限度として債務を直接に履行する義務を負う\n・AはCに賃料請求できる（AB間とBC間の低い方の金額が限度、CのBへの前払は考慮されない）\n・CはAに修繕の請求ができない（CはBに請求して、BがAに請求する）\n・Bの債務不履行でAB間が解除されたらCは対抗できない（合意解除の場合は対抗できる。ただしAが債務不履行による解除権を有している場合を除く）\n・AB間を債務不履行解除する場合、Cに通知して賃料を支払う機会を与える必要はない" },
      { id:"m16-06", q:"5 敷金",
        a:"⑴ 敷金の承継：賃貸人の変更→敷金関係は**新賃貸人に引き継がれる**／賃借人の変更→敷金関係は**新賃借人に引き継がれない**\n⑵ 明渡しが先履行：賃貸借契約が終了した場合、明渡しが完了しなければ敷金を返還請求することはできない（**同時履行ではない**）" },
      { id:"m16-07", q:"6 不動産賃借権の対抗要件（賃貸人たる地位の移転）",
        a:"賃借人が第三者（新賃貸人や賃借権が二重に設定されていた場合）に対抗するためには賃借権の登記（借地借家法では引渡し）が必要。\n\n賃借人に対抗要件あり：ACの所有権の移転に伴って、賃貸人の地位が移転する\n賃借人に対抗要件なし：ACの所有権の移転に伴って、賃貸人の地位は移転しない（賃借人の承諾なしにACの合意により賃貸人の地位を移転させることができる）",
        trap:"対抗要件ありの場合、①賃貸人の地位をAに留保すること②CがAに賃貸することをACで合意した場合は、賃貸人の地位は移転しない。\n新賃貸人Cが所有者であることを主張して賃料請求するには所有権移転登記が必要。" }
    ]},
    { id:"ch17", title:"第17章 借地借家法（借地権）", items:[
      { id:"m17-00", q:"借地権とは",
        a:"借地権とは、建物所有を目的とする賃借権と地上権。\n期間や更新などに関する借地借家法の定めよりも借主に不利な特約は無効となる。",
        trap:"×駐車場目的\n×使用貸借権（無償の賃借権）\n△一時使用（存続期間、更新、再築、更新拒絶の場合の建物買取請求権は適用されない）" },
      { id:"m17-01", q:"1 存続期間と法定更新",
        a:"特約がない限り中途解約はできない。",
        trap:"このテキストには存続期間の具体的な年数（最初の期間・更新後の期間）の記載がありませんでした。テキストの原本に表があれば、追加で送ってください。" },
      { id:"m17-02", q:"2 借地権の更新　⑴ 借主からの更新（請求による更新）",
        a:"借地上に建物が残っている場合に限り、同一条件で更新される。\n地主が正当事由をもって遅滞なく異議を述べれば更新されない。更新しない場合は借主に**建物買取請求権**が認められる。" },
      { id:"m17-03", q:"2 借地権の更新　⑵ 地主が何も言わない場合（法定更新）",
        a:"期間満了後も借主の使用に地主が異議を述べなければ勝手に更新される。\n正当事由の判断要素：使用の必要性・従前の経過・土地の利用状況・立退料などを総合考慮して決める。" },
      { id:"m17-04", q:"3 建物滅失と再築　⑴ 再築の申出をする",
        a:"最初の期間に滅失：再築の申出を地主に通知。地主の返事が**2ヶ月**なければ承諾したことになる→再築できる。\n更新後に滅失：地主の返事がなくても承諾したことにならない→承諾なければ再築できない。" },
      { id:"m17-05", q:"3 建物滅失と再築　⑵⑶ 承諾の有無",
        a:"⑵ 地主の承諾ある場合：承諾があった日または再築された日のいずれか早い日から**20年間**延長される。\n\n⑶ 地主の承諾ない場合\n最初の期間に滅失：地主が承諾しなくても期間満了まで借地権は消滅せず存続する。\n更新後に滅失：＜地主が主張できること＞承諾なしに再築した場合、解約の申入れをすることができる→**3ヶ月後**に契約終了／＜借主が主張できること＞地主が承諾しなければ地主の承諾に代わる裁判所の許可の申立てをすることができる。" },
      { id:"m17-06", q:"4 借地権の対抗要件",
        a:"借地権の対抗要件には以下の3種類がある。\n① 借地権の登記：現実的には困難（認められる＝表題登記・保存登記／認められない＝妻や子など他人名義の登記）\n② 借地上に建物を建てて登記する\n③ 掲示による保全：建物登記があった建物が滅失した場合、再築するまでの間は、その土地に一定事項を記載したものを掲示すれば、滅失から**2年間**は第三者に対抗できる",
        trap:"【判例①】借地権者が一筆の土地の上に一棟でも登記した建物を有するときは、他の建物について登記をしていなくても土地全体について借地権を対抗できる。\n【判例②】借地権者が二筆の土地を一体として利用している場合、一筆の土地上に登記ある建物を所有しているときは、建物の存在していない他の土地については賃借権の対抗力は及ばない。" },
      { id:"m17-07", q:"5 借地権の譲渡・転貸",
        a:"・借地権（賃借権）の譲渡・転貸には地主の承諾が必要\n・借地上の建物を譲渡するときは借地権も同時に移転するので地主の承諾が必要\n・借地上の建物を賃貸するときは借地権と無関係なので地主の承諾は不要\n\n建物譲渡について地主の承諾が得られない場合：\n借主ができること＝地主の承諾に代わる裁判所の許可をもらう\n建物譲受人ができること＝建物買取請求権を行使する" },
      { id:"m17-08", q:"6 建物買取請求権・裁判所の許可",
        a:"⑴ 建物買取請求権を行使できる場合（地主に対して建物を時価で買い取るように請求できる権利）\n①借地契約が満了し契約が更新できなかった場合（借主が行使）\n②建物を建物譲受人に譲渡したが地主が承諾しない場合（建物譲受人が行使）\n\n⑵ 地主の承諾に代わる裁判所の許可を利用できる場合\n①建物の増改築について当事者間で協議が調わない場合\n②更新後の建物の再築を地主が承諾しない場合\n③借地権を第三者に譲渡・転貸したが地主が承諾しない場合（譲渡人が行う）\n④競売による譲渡を地主が承諾しない場合（建物取得者が行う）\n\n⑶ 裁判所による条件変更：建物の種類・構造・規模などを制限する借地条件を変更する協議が調わなかった場合は、裁判所は当事者の申立てにより、借地条件を変更することができる",
        trap:"債務不履行解除の場合は建物買取請求権を有しない。\n借主は建物代金の支払いまで土地や建物の同時履行を主張できる。" },
      { id:"m17-09", q:"7 定期借地権・事業用定期借地権",
        a:"定期借地権：期間**50年以上**／書面（電磁的記録可）／利用目的は自由\n事業用定期借地権：期間**10年以上50年未満**／公正証書／利用目的は事業用（居住は不可）\n共通のメリット：①更新がない　②建物買取請求権は排除される",
        trap:"建物譲渡特約付借地権は省略。" }
    ]},
    { id:"ch18", title:"第18章 借地借家法（借家権）", items:[
      { id:"m18-00", q:"借家権とは",
        a:"借地借家法は一時使用を除く建物賃貸借契約に適用される。\n借地借家法よりも借主に不利な特約は無効。",
        trap:"×一時使用目的\n×使用貸借\n造作買取請求権（後述4）と居住用建物の賃借権の承継（後述6）については特約で排除できる。" },
      { id:"m18-01", q:"1 存続期間と法定更新　⑴ 存続期間を定める場合",
        a:"存続期間：上限なし、下限は**1年**（1年未満を定めると期間の定めがないものとなる）\n法定更新（更新とみなされる）：\n①期間満了の**1年前から6ヶ月前**までに更新拒絶の通知をしない場合\n②賃貸人が更新拒絶の通知をしたが、賃借人が建物の使用を継続し賃貸人も遅滞なく異議を述べない場合",
        trap:"賃貸人からの更新拒絶には正当事由が必要。" },
      { id:"m18-02", q:"1 存続期間と法定更新　⑵ 存続期間を定めない場合",
        a:"当事者の解約の申入れで終了する。\n賃貸人からの解約申入れ：正当事由＋**6ヶ月後**に終了\n賃借人からの解約申入れ：**3ヶ月後**に終了（正当事由は不要）" },
      { id:"m18-03", q:"2 対抗要件",
        a:"① 借家権の登記：現実的には困難\n② 建物の引渡し：鍵をもらっていたり、実際に居住している場合" },
      { id:"m18-04", q:"3 建物の転貸",
        a:"建物を転貸するには賃貸人の承諾が必要。\n\n賃貸借契約が終了した場合に転借人はどうなるか：\n期間満了・解約の申入れ：AはCに賃貸借の終了を通知すると**6ヶ月後**に転貸借は終了する\n合意解除：Aは賃貸借の終了を転借人Cに対抗できない\n債務不履行解除：AはBに催告すればよくCに通知する必要はない。Cは直ちに明渡しに応じなければならない" },
      { id:"m18-05", q:"4 造作買取請求権",
        a:"借主等が取り付けたクーラー等を退去時に賃貸人に買い取ってもらう権利。\n誰ができるか：借主、転借人\n条件：①賃貸人の承諾を得て取り付けたもの②期間満了または解約申入れによって終了",
        trap:"債務不履行で終了した場合は不可。\n造作買取請求権を行使しない特約は有効（任意規定）。\n造作の買取と建物の明渡は同時履行ではない。" },
      { id:"m18-06", q:"5 借地上の建物の賃借権",
        a:"期間満了：Cが期間満了を**1年前**までに知らなかった場合、裁判所は、Cが知った日から**1年**を超えない範囲で明渡しの猶予を与えることができる。\n債務不履行解除：Cは直ちに明渡しに応じなければならない。" },
      { id:"m18-07", q:"6 居住用建物の賃借権の承継",
        a:"居住用の建物について、借家人が相続人なしに死亡したときは、事実上夫婦または養親子関係にあった同居人は、借家人の権利義務関係を引継ぐ（特約で排除可）。",
        trap:"同居人は、借家人が死亡したことを知ったときから**1ヶ月以内**に、家主に対して反対の意思表示をすれば承継しない。" },
      { id:"m18-08", q:"7 定期建物賃貸借契約（更新がない借家権）",
        a:"定期建物賃貸借契約は書面または電磁的記録でしなければならない（公正証書は不要）。\n期間：期間の定めは必要だが**1年未満**でもよい\n説明：更新しない旨を賃貸借契約書とは別の書面（賃借人の承諾があれば電磁的方法可）を交付して説明する必要がある\n中途解約：床面積が**200㎡未満**の居住用建物の賃貸借で、転勤や療養などやむを得ない事情があるときは賃借人から中途解約ができる\n終了：期間が1年以上の場合、**1年前から6ヶ月前**までの間に家主のほうから通知しなければ終了を対抗できない",
        trap:"説明の書面がなければ「更新がない」部分が無効となる。\n取壊し予定建物の賃借権は、取り壊す事由を記載した書面（電磁的記録可）で行う。" },
      { id:"m18-09", q:"8 地代・家賃の増減額請求（借地・借家共通）",
        a:"地代等が、経済事情の変動または近隣の土地と比較して不相当となった場合、当事者は将来に向かって地代等の増減を請求することができる。\n裁判が確定するまでは、当事者間で協議が調わない場合、請求を受けた者は相当と考える額の地代等の支払いまたは請求をすることができる。\n裁判が確定し、すでに支払った金額に過不足がある場合は**1割の利息**をつけて支払いまたは返還をしなければならない。",
        trap:"一定期間増額しない特約は有効（減額しない特約は無効）。\n定期建物賃貸借契約において特約がある場合には適用されない。" }
    ]},
    { id:"ch19", title:"第19章 請負・委任・贈与", items:[
      { id:"m19-01", q:"1 請負契約　当事者の義務・製作物の所有権",
        a:"請負人の義務→仕事完成義務\n注文者の義務→報酬支払義務（後払い・目的物の引渡しと同時に支払う）\n\n製作物の所有権：\n＜注文者が材料の全部又は主要部分を提供した場合＞注文者に帰属\n＜請負人が材料の全部又は主要部分を提供した場合＞請負人に帰属",
        trap:"注文者が代金の大部分をすでに支払っている場合も、材料提供者に帰属するルールは変わらない。" },
      { id:"m19-02", q:"1 請負契約　注文者の解除権・破産と解除",
        a:"注文者の解除権：仕事が完成しない間は、注文者はいつでも損害賠償して契約解除できる。\n注文者の破産と解除：注文者が破産手続開始の決定を受けた時は、請負人又は破産管財人は契約の解除をすることができる（請負人から解除する場合は仕事の完成前に限る）。",
        trap:"目的物が可分で既に完成している部分は解除不可。" },
      { id:"m19-03", q:"1 請負契約　割合報酬・契約不適合責任",
        a:"割合報酬：仕事の結果が可分な場合で、①注文者の責めに帰することができない事由によって仕事を完成することができなくなったとき②仕事の完成前に解除されたときは、その部分に限り仕事の完成とみなし、当該部分の報酬を請求できる。\n\n契約不適合責任の特則：注文者の供した材料の性質又は注文者の与えた指図によって生じた不適合を理由として、注文者は不適合責任を追及することはできない（請負人が材料又は指図が不適合であることを知りながら告げなかったときを除く）。\n期間制限：注文者が不適合を知った時から**1年以内**に請負人に通知する必要がある（請負人が不適合につき悪意重過失の場合は期間制限はない）。" },
      { id:"m19-04", q:"2 委任契約　委任の効力",
        a:"善管注意義務等：善管注意義務、報告義務、受取物及び果実の引渡義務、費用前払請求権\n復受任者の選任：①委任者の許諾　or　②やむを得ない事由が必要\n\n受任者の報酬：特約がなければ請求できない（無償が原則）。委任事務を履行した後でなければ請求できない。\n＜履行割合型の委任＞履行の割合に応じて報酬を請求できる\n＜成果完成型の委任＞報酬の支払いと成果の引渡しは同時履行。仕事の結果が可分な場合は割合報酬を請求できる" },
      { id:"m19-05", q:"2 委任契約　費用償還請求権・金銭消費責任",
        a:"費用償還請求権：①受任者は、委任事務を処理するのに必要と認められる費用を支出したときは委任者に対して費用及び利息を請求できる②受任者は自己に過失なく損害を受けたときは委任者に対して賠償を請求できる\n\n金銭消費責任：受任者は委任者に引き渡すべき金銭を自分のために使ったときは、使ったときからの利息をつけて、さらに損害があるときは損害賠償もしたうえで引き渡さなければならない" },
      { id:"m19-06", q:"2 委任契約　委任の解除",
        a:"各当事者はいつでも解除できる。",
        trap:"相手方に不利な時期に解除、委任者が受任者の利益をも目的とする委任を解除する場合は損害を賠償しなければならない（やむを得ないときは損害賠償も不要）。" },
      { id:"m19-07", q:"3 贈与契約",
        a:"書面によらない贈与は、各当事者が解除できる（履行が終わった部分については解除できない）。\n担保責任は、売買契約の規定が準用される。",
        trap:"このテキストの表は簡略な記載のみでした。詳細な条文まで必要であれば追加で送ってください。" }
    ]},
    { id:"ch20", title:"第20章 不法行為・事務管理", items:[
      { id:"m20-01", q:"1 不法行為　⑴ 一般不法行為",
        a:"不法行為に基づく損害賠償請求権は、故意又は過失により他人の身体・財産を侵害した場合に成立する。\n被害者が即死した場合も相続人に損害賠償請求権が相続される。\n正当防衛を行った者は損害賠償責任を負わない。" },
      { id:"m20-02", q:"不法行為と債務不履行の比較",
        a:"履行遅滞の時期：不法行為＝不法行為時／債務不履行＝請求時\n消滅時効：不法行為＝損害及び加害者を知った時から**3年**（生命・身体侵害は**5年**）、不法行為時より**20年**／債務不履行＝権利を行使できることを知ったときから**5年**、行使できるときから**10年**\n過失相殺：不法行為＝被害者の過失を考慮することができる（任意的）／債務不履行＝被害者の過失を考慮しなければならない（必要的）",
        trap:"悪意による不法行為や生命・身体の侵害による場合は、加害者からの相殺は禁止（被害者からの相殺は問題なし）。" },
      { id:"m20-03", q:"⑵ 監督義務者の責任",
        a:"一般不法行為が成立するには加害者の責任能力（自分の行為が違法だと認識できる能力、13歳前後）が必要。\n責任能力がなく一般不法行為責任を負わない場合は、親権者などの監督義務者が責任を負う。",
        trap:"認知症疾患者の同居の配偶者は監督義務者にあたらない。" },
      { id:"m20-04", q:"⑶ 自力救済の禁止",
        a:"自己の権利が侵害された場合に、司法の手続きによらず自力で侵害を排除することは原則として認められない。\n例外：裁判を行っていては違法な侵害に対抗して現状を維持することが不可能であると認められる緊急やむを得ない特別の事情がある場合には、必要の限度を超えない範囲で、例外的に自力救済が認められる。",
        trap:"家賃滞納者の建物の鍵とシリンダーを交換することは自力救済にあたり、不法行為が成立する。" },
      { id:"m20-05", q:"2 使用者責任",
        a:"会社は従業員が事業の執行について第三者に加えた損害について従業員と連帯して責任を負う。\n事業の執行について：客観的に外形で判断する（例：社用車をプライベートで利用していても事業の執行にあたる）。\n不真正連帯債務：被害者は、従業員と会社の双方に全額を請求できる。\n求償権：会社が賠償した場合は相当額を従業員に求償できる（全額ではない）。",
        trap:"従業員の選任監督について相当の注意をしたとき、相当の注意をしても損害が発生したことを証明したときは使用者は責任を負わない。\n＜逆求償＞被用者が使用者の事業の執行について第三者に損害を加え、その損害を賠償した場合には、被用者は、損害の公平な分担という見地から相当と認められる額について、使用者に対して求償することができる。" },
      { id:"m20-06", q:"3 工作物責任",
        a:"工作物の瑕疵によって他人に損害を加えた場合、以下の者は工作物責任を負う（例：ビルの外壁が崩れて通行人がケガをしたような場合）。\n一次的責任：占有者が責任を負う\n二次的責任：所有者が無過失責任を負う\n求償権：他にも責任がある者が存在する場合はその者に求償できる",
        trap:"占有者は、必要な注意をしたことが認められれば責任を負わない。" },
      { id:"m20-07", q:"4 共同不法行為",
        a:"数人が共同して不法行為をした場合、被害者は全員に対して全額を請求できる。",
        trap:"共同不法行為者は各自が連帯して損害賠償責任を負う（旧不真正連帯債務）。\n連帯債務者の一人に生じた事由は他の債務者に影響しない。" },
      { id:"m20-08", q:"5 事務管理（参考）　成立要件・管理者の義務",
        a:"成立要件：①他人の事務を管理すること②他人のためにする意思があること③法律上の義務がないこと④本人の意思に反しない、本人に不利益であることが明らかでないこと\n\n管理者の義務：本人の意思、利益に適合した方法で管理すべき義務／管理開始を遅滞なく本人に通知する義務／継続的管理義務／善管注意義務（事務が終了したら遅滞なく本人に報告する義務、事務処理にあたって受け取った金銭を本人に引渡す義務）",
        trap:"他人のためにする意思は、自己のためにする意思と併存しても構わない。\n緊急事務管理の場合は悪意・重過失がある場合にのみ責任を負う。" },
      { id:"m20-09", q:"5 事務管理（参考）　本人の義務",
        a:"報酬支払義務、損害賠償義務はない。\n管理者が有益費を支出した場合は有益費償還義務を負う。\n管理者が有益な債務を負担した場合は代弁済義務を負う。",
        trap:"本人の利益に反して管理した場合は本人が現に利益を受ける限度で返還を受ける。\n管理者は費用の前払いを請求できない。" }
    ]},
    { id:"ch21", title:"第21章 相続", items:[
      { id:"m21-01", q:"1 相続人・法定相続分　⑴⑵ 配偶者・子",
        a:"配偶者は常に相続人となる（内縁の妻は相続人ではない）。\n子にあたる→非嫡出子、養子、胎児\n子にあたらない→再婚相手の連子",
        trap:"離婚すれば元配偶者は相続人ではなくなるが、子は相続人となる。" },
      { id:"m21-02", q:"相続人の順位",
        a:"第1順位　子：配偶者**1/2**　子**1/2**\n第2順位　直系尊属：配偶者**2/3**　直系尊属**1/3**\n第3順位　兄弟姉妹：配偶者**3/4**　兄弟姉妹**1/4**" },
      { id:"m21-03", q:"⑶ 代襲相続",
        a:"相続人が相続開始前に死亡・欠格・廃除があった場合は、その子が相続する。",
        trap:"相続放棄の場合は代襲相続は認められない。\n第1順位の子は無限に代襲相続（再代襲）するが、第3順位の兄弟姉妹は1回だけ。" },
      { id:"m21-04", q:"⑷ 欠格・廃除",
        a:"欠格：故意に被相続人を死亡させたり、遺言書を偽造したなど相続人になれない者（当然に）\n廃除：著しい非行があったような場合、家庭裁判所の審判によって相続権を失わせる制度（請求が必要）" },
      { id:"m21-05", q:"2 相続財産　⑴ 相続の効力",
        a:"相続人は被相続人の一切の権利義務を承継する。\n→ 売主の死亡でも売買契約は終了しない、賃貸人の死亡でも賃貸借契約は終了しない。" },
      { id:"m21-06", q:"⑵ 相続財産（当然分割・共有）",
        a:"相続開始時から当然分割される：可分債権／不動産から生じる賃料債権／可分債務／連帯債務\n相続開始時から共有となる：現金、株式、不動産／不可分債権／普通預金債権／不可分債務",
        trap:"共有に関する各持分は法定相続分等が基準となる。\n共有持分に基づいて占有している相続人の1人に対し、他の相続人は当然に明渡しを請求することはできない。" },
      { id:"m21-07", q:"3 相続の手続　⑴ 相続の承認・放棄",
        a:"承認や放棄は相続開始のあったことを知ったときから**3ヶ月以内**に家庭裁判所に申述しなければならない。\n\n単純承認：マイナスの財産も含めて全て相続すること（相続財産を一部でも処分すると単純承認したことになる。3ヶ月以内に手続きしなかったら単純承認したことになる）\n限定承認：プラスの財産の限度内でマイナスの財産も相続すること（共同相続人の全員が共同して行う）\n相続放棄：相続を一切しないこと",
        trap:"相続開始前の承認・放棄はできない。\n一度、承認・放棄をすると撤回できない。" },
      { id:"m21-08", q:"⑵ 遺産分割",
        a:"共有となっている相続財産を、協議を行い相続分を決めること。共同相続人はいつでも遺産の分割を請求できる（協議が調わない場合は家庭裁判所に分割を請求できる）。\n\n遺産分割の禁止：＜被相続人＞遺言で**5年以内**の遺産分割を禁止することができる／＜相続人＞共同相続人で合意すれば5年以内の遺産分割を禁止することができる（更新可、終期は相続開始から10年を超えることができない）\n\n遺産分割の効力：相続開始時に遡って効力が生じる（ただし第三者の権利を害することはできない）",
        trap:"相続開始から**10年**を経過した後にする遺産分割は、原則として法定相続分によって行われる。\n「相続させる」趣旨の遺言は、遺産分割方法の指定であり、何らの行為を要せずに当該相続人に承継される（共有にならないので遺産分割をせずに直ちに取得できる）。" },
      { id:"m21-09", q:"4 遺言と遺留分　⑴ 遺言",
        a:"遺言は**15歳以上**であればすることができる。複数の人の遺言を同一の証書に書くことはできない。遺言はいつでも撤回できる。前後2つの遺言で矛盾する部分がある場合、後の遺言が有効になる。\n\n自筆証書遺言：遺言者が全文・日付・氏名を自書し印を押す（相続財産目録は自書しなくてよいが各ページに署名押印が必要）\n公正証書遺言：証人2人以上の立合いのもと、公証人に口述し筆記してもらう\n秘密証書遺言：封印した遺言書を公証人に提出する",
        trap:"自筆証書遺言と秘密証書遺言では検認が必要（ただし検認を怠っても無効にはならない）。" },
      { id:"m21-10", q:"⑵ 遺留分",
        a:"配偶者：法定相続分の**1/2**\n子：法定相続分の**1/2**\n直系尊属：法定相続分の**1/3**",
        trap:"兄弟姉妹には遺留分はない。\n遺言が遺留分を侵害していても無効になるわけではなく、遺留分侵害請求権を行使しなければならない（相続の開始及び遺留分侵害を知ったときから1年、または相続開始より10年で消滅する）。\n遺留分は相続開始前でも家庭裁判所の許可を得れば放棄できる。" },
      { id:"m21-11", q:"5 配偶者居住権　⑴ 配偶者短期居住権",
        a:"配偶者以外の者が自宅を相続するときでも、配偶者が最低**6ヶ月**は無償で自宅に住める権利。",
        trap:"配偶者が①相続開始時に②無償で居住していた場合に限る。" },
      { id:"m21-12", q:"⑵ 配偶者居住権",
        a:"配偶者が終身又は一定期間その自宅に住み続ける権利（相続開始時に居住していた建物の配偶者居住権を遺産分割や遺贈で取得した場合に限る）。\n・建物の全部に及ぶ\n・配偶者居住権は相続されない\n・存続期間が定められた場合は延長や更新は認められない\n・使用のみならず、所有者の承諾を得て収益・増改築もできる\n・配偶者は居住建物の通常の必要費を負担する\n・第三者に対抗するには配偶者居住権の登記が必要（所有者は登記を備えさせる義務を負う）" }
    ]},
    { id:"ch22", title:"第22章 不動産登記法", items:[
      { id:"m22-01", q:"1 登記の手続　登記の単位・代理人の権限",
        a:"登記は一筆の土地または1個の建物ごとに作成する。\n代理人によって登記を申請する場合、その代理人の権限は本人が死亡しても消滅しない。" },
      { id:"m22-02", q:"公開（登記事項証明書等）",
        a:"登記事項証明書：誰でも交付を求めることができる（郵送、オンラインも可）\n附属書類（図面）：誰でも図面の写しの交付・閲覧を請求できる\n附属書類（図面以外）：本人＝閲覧を請求できる／第三者＝正当な理由があると認められる者は、正当な理由があると認められる部分の閲覧を請求することができる\n所有不動産記録証明書：自らが所有権の登記名義人として記録されている不動産の一覧を請求できる（相続人も可）",
        trap:"登記名義人が犯罪被害者等であって、住所が公開されることにより生命・身体に危害を及ぼす恐れがある場合、その人からの申出があったときは、住所に代わる事項を記載しなければならない。" },
      { id:"m22-03", q:"申請主義の原則",
        a:"原則：当事者又は官公庁が登記官に申請する（登記する義務は原則としてない＝任意）\n例外：登記官が職権で行う場合がある（例：表示の登記）",
        trap:"表示の登記（新築・滅失など）は1ヶ月以内に申請しなければならない。\n登記官は、職権による登記をし、または地図を作成するために必要な限度で、地方公共団体の長等に対して、不動産の所有権等に関する情報の提供を求めることができる。" },
      { id:"m22-04", q:"相続による所有権移転登記の義務化",
        a:"⑴ 申請義務：相続（遺言含む）により不動産を取得した相続人は、相続開始があったことを知り、かつ、所有権を取得したことを知った日から**3年以内**に、所有権移転登記を申請しなければならない\n⑵ 遺産分割が成立したとき：⑴の後の遺産分割により法定相続分を超えて所有権を取得した相続人は、遺産分割の日から**3年以内**に所有権移転登記を申請しなければならない\n⑶ 違反した場合：正当な理由なく申請しなかった場合、**10万円以下の過料**" },
      { id:"m22-05", q:"相続人の申告登記",
        a:"⑷ 申告登記：⑴の申請義務を負うものは、①相続が開始したこと②自らが相続人であることを申し出ることができる（⑴の履行をしたことになる）\n⑸ 遺産分割が成立したとき：⑷の後に遺産分割で所有権を取得したときは遺産分割の日から**3年以内**に所有権移転登記を申請しなければならない\n⑹ 違反した場合：正当な理由なく申請しなかった場合、**10万円以下の過料**" },
      { id:"m22-06", q:"住所等変更登記の義務化",
