/* ========== ここから下はアプリ本体 ========== */
const KEY = "takken-marks-v1";
const SYM = { o:"○", s:"△", x:"×" };
const LABEL = { o:"言えた", s:"あやしい", x:"言えない" };
let marks = {};
try { marks = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { marks = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch(e) {} };

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
function fmt(s){
  // 行頭が「|」の連続はテーブルとして描画する（1行目=見出し行）
  const lines = String(s).split("\n");
  let out = "", i = 0, buf = [];
  const flush = () => { if (buf.length){ out += inline(buf.join("\n")).replace(/\n/g, "<br>"); buf = []; } };
  while (i < lines.length){
    if (lines[i].trim().startsWith("|")){
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")){
        rows.push(lines[i].trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
        i++;
      }
      flush();
      const [head, ...body] = rows;
      out += `<table class="tbl"><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead>
        <tbody>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    } else {
      buf.push(lines[i]); i++;
    }
  }
  flush();
  return out;
}

const allItems = g => g.themes.flatMap(t => t.items);
function stats(items){
  const s = { o:0, s:0, x:0, n:0, total:items.length };
  items.forEach(it => { const m = marks[it.id]; if (m) s[m]++; else s.n++; });
  return s;
}
function progHTML(items){
  const s = stats(items);
  const pct = s.total ? Math.round(s.o / s.total * 100) : 0;
  return `<div class="prog"><span class="po"><b>○</b>${s.o}</span><span class="ps"><b>△</b>${s.s}</span><span class="px"><b>×</b>${s.x}</span><span>未判定 ${s.n}</span></div>
  <div class="bar" aria-label="○の割合 ${pct}%"><i style="width:${pct}%"></i></div>`;
}

/* ---------- 画面の状態 ---------- */
let filter = "all";      // all | weak | none
let openIds = new Set();
let stampedId = null;
let shuf = null;

/* ---------- ホーム ---------- */
function renderHome(){
  app.style.setProperty("--g", "var(--ink)");
  app.innerHTML = `
  <h1 class="title">宅建 暗記目次</h1>
  <p class="lead">目次を見て説明できるか試す。詰まったときだけ開く。</p>
  <ul class="genres">
    ${DATA.map(g => {
      const items = allItems(g);
      return `<li><button class="genre" data-act="nav" data-to="g/${g.id}" style="--gc:${g.color}">
        <span class="tab" aria-hidden="true">${g.no}</span>
        <span class="body"><span class="name">${esc(g.name)}</span>
        <div class="meta">テーマ ${g.themes.length}　目次 ${items.length}</div>
        ${items.length ? progHTML(items) : ""}</span></button></li>`;
    }).join("")}
  </ul>
  <section class="shuf">
    <h3>ランダムで復習</h3>
    <div class="meta">全ジャンルの目次をシャッフルして1つずつ出します。</div>
    <div class="btns">
      <button class="btn" data-act="nav" data-to="shuffle/all">すべて</button>
      <button class="btn ghost" data-act="nav" data-to="shuffle/weak">△×だけ</button>
    </div>
  </section>
  <div class="foot"><button data-act="reset">○△×をすべて消す</button></div>`;
}

/* ---------- ジャンル ---------- */
function renderGenre(g){
  app.style.setProperty("--g", g.color);
  app.innerHTML = `
  <button class="back" data-act="nav" data-to="">‹ ジャンル</button>
  <h2 class="h2"><small>${g.no}</small>${esc(g.name)}</h2>
  ${g.themes.length ? `<div style="--gc:${g.color}">${progHTML(allItems(g))}</div>
  <ul class="themes">
    ${g.themes.map(t => `<li class="theme"><button data-act="nav" data-to="g/${g.id}/t/${t.id}" style="--gc:${g.color}">
      <div class="tt">${esc(t.title)}</div>
      <div class="meta">目次 ${t.items.length}</div>${t.items.length ? progHTML(t.items) : ""}</button></li>`).join("")}
  </ul>` : `<p class="empty">テーマはまだありません。内容を追加すると、ここに表示されます。</p>`}`;
}

/* ---------- テーマ（目次一覧） ---------- */
function detailHTML(it){
  return `<div class="detail">
    <div class="a">${fmt(it.a)}</div>
    ${it.trap ? `<div class="trap"><b>ひっかけ注意</b>${fmt(it.trap)}</div>` : ""}
    <div class="rate" role="group" aria-label="自己判定">
      ${["o","s","x"].map(k => `<button data-act="rate" data-id="${it.id}" data-k="${k}" class="m-${k} ${marks[it.id]===k?"sel":""}"><span>${SYM[k]}</span>${LABEL[k]}</button>`).join("")}
    </div></div>`;
}
function stampHTML(id){
  const m = marks[id];
  const cls = m ? `on m-${m}` : "";
  return `<span class="stamp ${cls} ${stampedId===id?"pop":""}" aria-label="${m?LABEL[m]:"未判定"}">${m?SYM[m]:""}</span>`;
}
function renderTheme(g, t){
  app.style.setProperty("--g", g.color);
  const list = t.items.filter(it => {
    const m = marks[it.id];
    if (filter === "weak") return m === "s" || m === "x";
    if (filter === "none") return !m;
    return true;
  });
  const emptyMsg = { all:"目次はまだありません。", weak:"△×の目次はありません。", none:"未判定の目次はありません。" }[filter];
  app.innerHTML = `
  <button class="back" data-act="nav" data-to="g/${g.id}">‹ ${esc(g.name)}</button>
  <h2 class="h2">${esc(t.title)}</h2>
  <div style="--gc:${g.color}">${progHTML(t.items)}</div>
  <div class="seg" role="group" aria-label="絞り込み">
    ${[["all","すべて"],["weak","△×だけ"],["none","未判定"]].map(([k,l]) =>
      `<button data-act="filter" data-k="${k}" aria-pressed="${filter===k}">${l}</button>`).join("")}
  </div>
  ${list.length ? `<ul class="items">
    ${list.map(it => `<li class="item ${openIds.has(it.id)?"open":""}">
      <button class="q" data-act="toggle" data-id="${it.id}" aria-expanded="${openIds.has(it.id)}">
        ${stampHTML(it.id)}<span class="qt">${esc(it.q)}</span><span class="chev" aria-hidden="true"></span>
      </button>${openIds.has(it.id) ? detailHTML(it) : ""}</li>`).join("")}
  </ul>` : `<p class="empty">${emptyMsg}</p>`}`;
  stampedId = null;
}

/* ---------- ランダム ---------- */
function startShuffle(scope){
  let list = [];
  DATA.forEach(g => g.themes.forEach(t => t.items.forEach(it => list.push({ it, g, t }))));
  if (scope === "weak") list = list.filter(x => marks[x.it.id] === "s" || marks[x.it.id] === "x");
  for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  shuf = { scope, list, i:0, shown:false };
}
function renderShuffle(){
  app.style.setProperty("--g", "var(--ink)");
  const head = `<button class="back" data-act="nav" data-to="">‹ ジャンル</button>
    <h2 class="h2">ランダムで復習${shuf.scope==="weak" ? "（△×だけ）" : ""}</h2>`;
  if (!shuf.list.length){
    app.innerHTML = head + `<p class="empty">${shuf.scope==="weak" ? "△×の目次はありません。" : "目次がまだありません。"}</p>`;
    return;
  }
  if (shuf.i >= shuf.list.length){
    const s = stats(shuf.list.map(x => x.it));
    app.innerHTML = head + `<div class="card"><div class="bigq">${shuf.list.length}問おわり</div>
      <div class="prog"><span class="po"><b>○</b>${s.o}</span><span class="ps"><b>△</b>${s.s}</span><span class="px"><b>×</b>${s.x}</span></div>
      <div class="btns"><button class="btn" data-act="again">もう一周</button><button class="btn ghost" data-act="nav" data-to="">ジャンルへ</button></div></div>`;
    return;
  }
  const { it, g, t } = shuf.list[shuf.i];
  app.innerHTML = head + `<div class="count">${shuf.i + 1} / ${shuf.list.length}</div>
  <div class="card" style="--g:${g.color}">
    <div class="where">${esc(g.name)} ／ ${esc(t.title)}</div>
    <div class="bigq">${esc(it.q)}</div>
    ${shuf.shown ? detailHTML(it) :
      `<div class="btns"><button class="btn" data-act="quick-o">○ 言えた</button><button class="btn ghost" data-act="show">詳細を見る</button></div>`}
  </div>`;
}

/* ---------- ルーティング ---------- */
/* 画面の場所は内部で管理（プレビュー環境でもリンクで外に飛ばないように）。
   単独で開いたとき（GitHub Pages等）はURLの#にも反映し、ブラウザの戻るボタンを使えるようにする */
const standalone = (() => { try { return window.self === window.top; } catch(e) { return false; } })();
let path = standalone ? location.hash.replace(/^#\/?/, "") : "";
function nav(to){
  path = to;
  if (standalone){ try { location.hash = "/" + to; return; } catch(e) {} }
  route();
}
function route(){
  const h = path.split("/").filter(Boolean);
  if (h[0] === "g"){
    const g = DATA.find(x => x.id === h[1]);
    if (g && h[2] === "t"){
      const t = g.themes.find(x => x.id === h[3]);
      if (t){ filter = "all"; renderTheme(g, t); window.scrollTo(0,0); return; }
    }
    if (g){ renderGenre(g); window.scrollTo(0,0); return; }
  }
  if (h[0] === "shuffle"){ startShuffle(h[1] === "weak" ? "weak" : "all"); renderShuffle(); window.scrollTo(0,0); return; }
  renderHome(); window.scrollTo(0,0);
}
function current(){
  const h = path.split("/").filter(Boolean);
  const g = DATA.find(x => x.id === h[1]);
  return { g, t: g && g.themes.find(x => x.id === h[3]) };
}

/* ---------- 操作 ---------- */
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "nav"){ nav(b.dataset.to); }
  else if (act === "toggle"){
    const id = b.dataset.id;
    if (openIds.has(id)) openIds.delete(id); else openIds.add(id);
    const { g, t } = current(); renderTheme(g, t);
  }
  else if (act === "filter"){
    filter = b.dataset.k;
    const { g, t } = current(); renderTheme(g, t);
  }
  else if (act === "rate"){
    const id = b.dataset.id;
    marks[id] = b.dataset.k; save();
    if (shuf && path.startsWith("shuffle")){
      shuf.i++; shuf.shown = false; renderShuffle();
    } else {
      stampedId = id;
      const { g, t } = current(); renderTheme(g, t);
    }
  }
  else if (act === "show"){ shuf.shown = true; renderShuffle(); }
  else if (act === "quick-o"){ marks[shuf.list[shuf.i].it.id] = "o"; save(); shuf.i++; renderShuffle(); }
  else if (act === "again"){ startShuffle(shuf.scope); renderShuffle(); window.scrollTo(0,0); }
  else if (act === "reset"){
    if (confirm("○△×の記録をすべて消します。よろしいですか？")){ marks = {}; save(); renderHome(); }
  }
});
window.addEventListener("hashchange", () => {
  const p = location.hash.replace(/^#\/?/, "");
  if (standalone && p !== path){ path = p; }
  if (standalone) route();
});
route();
</script>
</body>
